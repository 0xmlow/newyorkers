<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MLow's Mood Room / Blossom</title>

  <!-- ============================================================
       EXTERNAL DEPENDENCIES
       - Playfair Display: Serif display font (Georgia web substitute
         per Blossom brand guidelines)
       - ethers.js v6: Ethereum library for wallet connection and
         Self-contained interactive art piece
       ============================================================ -->

  <style>
    /* ==========================================================
       RESET & BASE STYLES
       Using Blossom brand palette:
         Primary BG: #0D0D0D (Black)
         Text: #F0F4F8 (Cloud)
         Accent: #2962FF (Electric Blue)
         Secondary accent: #3DFFC0 (Mint Green)
         Muted text: #8899AA (Slate)
         Card surfaces: #141820 (Dark Card)
         Dividers: #2A3040
       Typography: Calibri (body), Playfair Display/Georgia (display)
       ========================================================== */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: Calibri, 'Segoe UI', sans-serif; /* Blossom body font */
      min-height: 100vh;
      background: #0D0D0D;    /* Blossom primary black */
      color: #F0F4F8;          /* Blossom Cloud for text on dark */
      overflow-x: hidden;
      transition: color 0.6s;
    }

    /* ==========================================================
       FULLSCREEN ANIMATED BACKGROUND CANVAS
       This canvas sits behind all content (z-index: 0, fixed).
       JavaScript draws a generative particle flow field on it,
       with colors that smoothly transition when the user picks
       a new "mood."
       ========================================================== */
    #bg-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
    }

    /* All visible UI sits above the background canvas */
    .content {
      position: relative;
      z-index: 1;
    }

    /* ==========================================================
       HEADER
       Features the "MLow's MOOD ROOM" title in Playfair Display (serif),
       all-caps with wide letter spacing, plus a Blossom Electric
       Blue accent bar underneath.
       ========================================================== */
    header {
      text-align: center;
      padding: 2.5rem 1rem 0.5rem;
    }

    header h1 {
      font-family: 'Playfair Display', Georgia, serif; /* Blossom display font */
      font-size: 3rem;
      letter-spacing: 0.25em;      /* Wide tracking per brand guidelines */
      text-transform: uppercase;
      color: #fff;
      text-shadow: 0 0 30px rgba(41,98,255,0.4); /* Subtle blue glow */
    }

    header p {
      margin-top: 0.5rem;
      opacity: 0.5;
      font-size: 0.9rem;
      letter-spacing: 0.05em;
      color: #8899AA;  /* Blossom Slate for muted text */
    }

    /* ==========================================================
       BLOSSOM ICON STRIP
       Displays all 7 modular Blossom icons in a horizontal row.
       Icons are black SVGs inverted to white via CSS filter.
       They scale and rotate on hover for playful interaction.
       ========================================================== */
    .blossom-row {
      display: flex;
      justify-content: center;
      gap: 1.2rem;
      padding: 1rem 0 0.5rem;
      flex-wrap: wrap;
    }

    .blossom-row img {
      width: 36px;
      height: 36px;
      filter: invert(1);       /* Turns black SVGs to white (dark bg rule) */
      opacity: 0.2;
      transition: opacity 0.4s, transform 0.4s;
    }

    .blossom-row svg:hover, .blossom-row-icon:hover {
      opacity: 0.7;
      transform: scale(1.3) rotate(15deg);
    }

    /* ==========================================================
       MOOD BUTTONS
       Pill-shaped buttons that switch the page's color mood.
       Styled with Electric Blue borders and Light Blue text.
       On hover they glow; when active they fill slightly.
       ========================================================== */
    .mood-bar {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.7rem;
      padding: 1.2rem 1rem;
    }

    .mood-btn {
      padding: 0.55rem 1.4rem;
      border: 2px solid rgba(41,98,255,0.3);   /* Electric Blue at 30% */
      border-radius: 999px;                      /* Full pill shape */
      background: rgba(41,98,255,0.05);
      color: #7EB8FF;                            /* Blossom Light Blue */
      font-family: Calibri, sans-serif;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.3s;
      letter-spacing: 0.06em;
    }

    .mood-btn:hover {
      transform: scale(1.12);
      border-color: #2962FF;
      color: #fff;
      box-shadow: 0 0 18px rgba(41,98,255,0.25);
    }

    .mood-btn.active {
      background: rgba(41,98,255,0.15);
      border-color: #2962FF;
      color: #fff;
    }

    /* ==========================================================
       DRAWING SECTION
       Contains brush tools, color palette, the drawing canvas,
       and save button. The canvas has a frosted glass look
       via backdrop-filter blur.
       ========================================================== */
    .draw-section {
      text-align: center;
      padding: 0.5rem 1rem 0.3rem;
    }

    .draw-section p {
      font-size: 0.8rem;
      opacity: 0.4;
      margin-bottom: 0.5rem;
      color: #8899AA;
    }

    /* Toolbar rows for brush types, colors, and actions */
    .draw-tools {
      display: flex;
      justify-content: center;
      gap: 0.4rem;
      margin-bottom: 0.5rem;
      flex-wrap: wrap;
    }

    .draw-tools button {
      padding: 0.3rem 0.7rem;
      border: 1px solid rgba(41,98,255,0.2);
      border-radius: 6px;
      background: rgba(41,98,255,0.06);
      color: #7EB8FF;
      font-family: Calibri, sans-serif;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .draw-tools button:hover {
      background: rgba(41,98,255,0.15);
      color: #fff;
    }

    /* Highlight the currently active brush or color */
    .draw-tools button.active-tool {
      background: rgba(41,98,255,0.25);
      border-color: #2962FF;
      color: #fff;
      box-shadow: 0 0 8px rgba(41,98,255,0.3);
    }

    /* Green-accented action buttons (save) */
    .draw-tools button.save-btn {
      border-color: rgba(61,255,192,0.3);
      color: #3DFFC0;               /* Blossom Mint Green */
      background: rgba(61,255,192,0.06);
    }

    .draw-tools button.save-btn:hover {
      background: rgba(61,255,192,0.15);
      color: #fff;
    }

    /* Color swatch buttons in the palette row */
    .color-swatch {
      width: 24px !important;
      height: 24px !important;
      padding: 0 !important;
      border-radius: 50% !important;    /* Circular swatches */
      border: 2px solid rgba(255,255,255,0.15) !important;
      min-width: 24px;
    }

    .color-swatch.active-tool {
      border-color: #fff !important;
      box-shadow: 0 0 10px rgba(255,255,255,0.4);
      transform: scale(1.2);
    }

    /* Section labels for brush/color rows */
    .tool-label {
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #8899AA;
      opacity: 0.4;
      margin-right: 0.3rem;
      align-self: center;
    }

    /* The drawing canvas itself */
    #draw-canvas {
      border: 1px solid rgba(41,98,255,0.15);
      border-radius: 12px;
      cursor: crosshair;
      display: block;
      margin: 0 auto;
      max-width: 95vw;
      background: rgba(20,24,32,0.6);   /* Semi-transparent Dark Card */
      backdrop-filter: blur(6px);         /* Frosted glass effect */
    }

    /* ==========================================================
       FLIP CARD GRID
       A responsive CSS Grid of 3D flip cards. Each card has a
       front face (Blossom icon) and back face (Snapple fact).
       Uses CSS perspective and backface-visibility for the
       3D flip animation triggered by adding .flipped class.
       ========================================================== */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.2rem;
      max-width: 880px;
      margin: 1.5rem auto 2rem;
      padding: 0 1.5rem;
    }

    .card {
      position: relative;
      height: 210px;
      perspective: 600px;    /* Creates 3D depth for the flip */
      cursor: pointer;
    }

    .card-inner {
      width: 100%; height: 100%;
      transition: transform 0.6s;
      transform-style: preserve-3d;  /* Children exist in 3D space */
      position: relative;
    }

    /* When .flipped is toggled, rotate the inner container 180deg */
    .card.flipped .card-inner { transform: rotateY(180deg); }

    /* Shared styles for both card faces */
    .card-front, .card-back {
      position: absolute;
      width: 100%; height: 100%;
      backface-visibility: hidden;  /* Hide the face when rotated away */
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      border-radius: 14px;
      padding: 1rem;
      text-align: center;
      background: #141820;          /* Blossom Dark Card */
      border: 1px solid #2A3040;    /* Blossom Divider */
    }

    /* Blossom icon on the card front (inverted to white) */
    .card-front svg {
      width: 72px !important;
      height: 72px !important;
      max-width: 72px;
      max-height: 72px;
      overflow: hidden;
      opacity: 0.85;
      transition: transform 0.3s;
    }

    /* Rotate icon slightly on card hover */
    .card:hover .card-front svg {
      transform: rotate(12deg) scale(1.1);
    }

    .card-front .label {
      display: block;
      font-size: 0.7rem;
      margin-top: 0.6rem;
      opacity: 0.35;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #8899AA;
    }

    /* The back face is pre-rotated 180deg so it faces correctly when flipped */
    .card-back {
      transform: rotateY(180deg);
      font-size: 0.88rem;
      line-height: 1.6;
      color: #F0F4F8;
    }

    .card-back .fact-label {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #2962FF;             /* Electric Blue accent */
      margin-bottom: 0.5rem;
    }

    /* ==========================================================
       SHUFFLE BUTTON ROW
       Centers the "Shuffle Facts" button below the card grid.
       ========================================================== */
    .shuffle-row {
      text-align: center;
      padding: 0.5rem 0 0;
    }

    /* ==========================================================
       CLICK PARTICLE BURSTS
       When the user clicks anywhere on the page, colored circles
       burst outward using CSS keyframe animation. Each particle
       gets random direction via CSS custom properties --dx, --dy.
       ========================================================== */
    .particle {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;        /* Clicks pass through particles */
      animation: burst 2s ease-out forwards;
    }

    @keyframes burst {
      0%   { opacity: 1; transform: scale(1) translate(0, 0); }
      100% { opacity: 0; transform: scale(0) translate(var(--dx), var(--dy)); }
    }

    /* ==========================================================
       SPARK COUNTER
       Shows total particle count from all clicks.
       ========================================================== */
    .counter {
      text-align: center;
      padding: 0.8rem;
      font-size: 0.8rem;
      color: #8899AA;
      opacity: 0.4;
    }

    /* ==========================================================
       FOOTER
       Displays the MLow logo and a tagline. Logo fades in on hover.
       ========================================================== */
    footer {
      text-align: center;
      padding: 2rem 1rem 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.6rem;
    }

    footer img.mlow-logo {
      width: 80px;
      opacity: 0.6;
      transition: opacity 0.3s;
    }

    footer img.mlow-logo:hover {
      opacity: 1;
    }

    footer .footer-text {
      font-size: 0.7rem;
      color: #8899AA;
      opacity: 0.4;
      letter-spacing: 0.08em;
    }

    /* ==========================================================
       ACCENT BAR
       A thin Electric Blue line used as a visual section divider
       beneath the title (per Blossom brand pattern).
       ========================================================== */
    .accent-bar {
      width: 60px;
      height: 3px;
      background: #2962FF;
      margin: 0 auto 0.8rem;
      border-radius: 2px;
    }

    /* ==========================================================
       FLOATING GARDEN DECORATIONS
       Large, nearly invisible Blossom icons fixed in the viewport
       corners, creating the "Garden" generative pattern concept
       from the Blossom brand system.
       ========================================================== */
    .garden-float {
      position: fixed;
      pointer-events: none;
      z-index: 0;
      opacity: 0.03;
      overflow: hidden;
    }


    /* Force white fill on all SVG paths in our containers */
    .blossom-row svg path,
    .blossom-row svg line,
    .garden-float path,
    .garden-float line,
    .card-front svg path,
    .card-front svg line {
      fill: white !important;
      stroke: white !important;
    }
  </style>

    <!-- ============================================================
         MOOD SELECTOR
         Five mood buttons that change the background animation colors,
         the drawing brush color, and the particle burst palette.
         Clicking an active mood button deselects it (returns to default).
         ============================================================ -->
    <div class="mood-bar">
      <button class="mood-btn" data-mood="sunset">Sunset</button>
      <button class="mood-btn" data-mood="ocean">Ocean</button>
      <button class="mood-btn" data-mood="forest">Forest</button>
      <button class="mood-btn" data-mood="galaxy">Galaxy</button>
      <button class="mood-btn" data-mood="midnight">Midnight</button>
    </div>

    <!-- ============================================================
         DRAWING CANVAS + TOOLS
         Three tool rows:
           1. Brush types (13 different brushes)
           2. Color palette (13 swatches + mood-linked option)
           3. Actions (clear, save as PNG)
         The canvas is 700x280 internal pixels, CSS-scaled responsively.
         ============================================================ -->
    <div class="draw-section">
      <p>Draw something below. Pick a brush and color, or let the mood set the vibe.</p>

      <!-- Row 1: Brush type selector -->
      <div class="draw-tools" id="brush-row">
        <span class="tool-label">Brush:</span>
      </div>

      <!-- Row 2: Color palette -->
      <div class="draw-tools" id="color-row">
        <span class="tool-label">Color:</span>
      </div>

      <!-- Row 3: Action buttons -->

  <script>
    // ==============================================================
    //  MOOD CONFIGURATION
    //  Each mood defines three color arrays:
    //    bg1: outer edge of the radial background gradient (darker)
    //    bg2: center of the radial background gradient (lighter)
    //    accent: color used for brush strokes, particles, and rings
    //    particles: hex palette for click-burst particle colors
    //  Colors smoothly interpolate (lerp) toward the target mood.
    // ==============================================================
    const moods = {
      default:  { bg1: [13,13,13],    bg2: [20,24,32],    accent: [41,98,255],   particles: ['#2962FF','#7EB8FF','#3DFFC0','#00E676','#F0F4F8'] },
      sunset:   { bg1: [60,10,5],     bg2: [90,30,0],     accent: [255,140,50],  particles: ['#ff4500','#ff6347','#ffa500','#ffd700','#ffe4b5'] },
      ocean:    { bg1: [5,15,30],     bg2: [10,35,55],    accent: [50,180,255],  particles: ['#00bfff','#1e90ff','#87ceeb','#4682b4','#b0e0e6'] },
      forest:   { bg1: [5,25,5],      bg2: [15,50,15],    accent: [0,230,118],   particles: ['#00E676','#3DFFC0','#32cd32','#228b22','#90ee90'] },
      galaxy:   { bg1: [15,5,35],     bg2: [40,10,70],    accent: [180,100,255], particles: ['#9b59b6','#8e44ad','#d2b4de','#bb8fce','#e8b4f8'] },
      midnight: { bg1: [5,5,5],       bg2: [10,10,10],    accent: [136,153,170], particles: ['#555','#777','#999','#bbb','#ddd'] },
    };

    // Current mood state: these arrays are continuously lerped toward the target
    let currentMood = 'default';
    let targetMood = moods.default;
    let liveBg1 = [...moods.default.bg1];
    let liveBg2 = [...moods.default.bg2];
    let liveAccent = [...moods.default.accent];

    // Linear interpolation helper: blends value a toward b by factor t
    function lerp(a, b, t) { return a + (b - a) * t; }

    // Applies lerp to each channel of an RGB color array
    function lerpColor(cur, target, t) {
      return cur.map((c, i) => lerp(c, target[i], t));
    }

    // ==============================================================
    //  GENERATIVE BACKGROUND ANIMATION
    //  A full-viewport canvas renders:
    //    1. A radial gradient that shifts with the active mood
    //    2. Expanding concentric rings pulsing from center
    //    3. 180 flow-field particles that drift in organic paths
    //       using sine/cosine noise for their angle of movement
    // ==============================================================
    const bgCanvas = document.getElementById('bg-canvas');
    const bgCtx = bgCanvas.getContext('2d');
    let bgW, bgH;

    // Keep the background canvas sized to the full window
    function resizeBg() {
      bgW = bgCanvas.width = window.innerWidth;
      bgH = bgCanvas.height = window.innerHeight;
    }
    resizeBg();
    window.addEventListener('resize', resizeBg);

    const NUM_PARTICLES = 180;
    const bgParticles = [];

    // Each FlowParticle drifts through a vector field and fades in/out
    class FlowParticle {
      constructor() { this.reset(); }

      // Place particle at a random position with random size/speed/lifespan
      reset() {
        this.x = Math.random() * bgW;
        this.y = Math.random() * bgH;
        this.size = 1 + Math.random() * 2.5;
        this.speed = 0.3 + Math.random() * 0.7;
        this.life = 0;
        this.maxLife = 300 + Math.random() * 400;
      }

      // Move along a flow field angle computed from sine/cosine noise
      update(time) {
        const scale = 0.002;
        const angle = Math.sin(this.x * scale + time * 0.0003) * Math.PI +
                      Math.cos(this.y * scale + time * 0.0002) * Math.PI;
        this.x += Math.cos(angle) * this.speed * MOODK;
        this.y += Math.sin(angle) * this.speed * MOODK;
        this.life += MOODK;
        // Reset if lifespan expired or drifted off screen
        if (this.life > this.maxLife || this.x < -20 || this.x > bgW + 20 || this.y < -20 || this.y > bgH + 20) {
          this.reset();
        }
      }

      // Draw with alpha that fades in then out over the particle's life
      draw(ctx) {
        const alpha = Math.sin((this.life / this.maxLife) * Math.PI) * 0.5;
        const [r, g, b] = liveAccent;
        ctx.fillStyle = `rgba(${r|0},${g|0},${b|0},${alpha})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // Initialize all background particles
    for (let i = 0; i < NUM_PARTICLES; i++) bgParticles.push(new FlowParticle());

    let ringPhase = 0; // Controls the expanding ring animation

    // Main background draw function, called every animation frame
    let MOODK = 1, moodLastT = 0;
    function drawBg(time) {
      /* per frame steps scaled to real time (2026-10-28): a 120 Hz screen ran the rings and the drift twice as fast */
      MOODK = moodLastT ? Math.min(4, Math.max(0, (time - moodLastT) / (1000 / 60))) : 1; moodLastT = time;
      // Smoothly interpolate current colors toward the target mood
      const lk = 1 - Math.pow(0.98, MOODK);
      liveBg1 = lerpColor(liveBg1, targetMood.bg1, lk);
      liveBg2 = lerpColor(liveBg2, targetMood.bg2, lk);
      liveAccent = lerpColor(liveAccent, targetMood.accent, lk);

      // Draw radial gradient background
      const grad = bgCtx.createRadialGradient(bgW/2, bgH/2, 0, bgW/2, bgH/2, bgW * 0.7);
      grad.addColorStop(0, `rgb(${liveBg2[0]|0},${liveBg2[1]|0},${liveBg2[2]|0})`);
      grad.addColorStop(1, `rgb(${liveBg1[0]|0},${liveBg1[1]|0},${liveBg1[2]|0})`);
      bgCtx.fillStyle = grad;
      bgCtx.fillRect(0, 0, bgW, bgH);

      // Draw 5 expanding concentric rings that fade out as they grow
      ringPhase += 0.008 * MOODK;
      const [ar, ag, ab] = liveAccent;
      for (let i = 0; i < 5; i++) {
        const radius = ((ringPhase + i * 0.2) % 1) * bgW * 0.6;
        const alpha = (1 - (ringPhase + i * 0.2) % 1) * 0.05;
        bgCtx.strokeStyle = `rgba(${ar|0},${ag|0},${ab|0},${alpha})`;
        bgCtx.lineWidth = 1.5;
        bgCtx.beginPath();
        bgCtx.arc(bgW / 2, bgH / 2, radius, 0, Math.PI * 2);
        bgCtx.stroke();
      }

      // Update and draw all flow-field particles
      bgParticles.forEach(p => { p.update(time); p.draw(bgCtx); });
    }

    // ==============================================================
    //  MOOD BUTTONS
    //  Clicking a mood button sets the target colors for the
    //  background, brush, and particles. Clicking the already-active
    //  button deselects it and returns to default Blossom blue.
    // ==============================================================
    const moodBtns = document.querySelectorAll('.mood-btn');
    moodBtns.forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const wasActive = btn.classList.contains('active');
        moodBtns.forEach(b => b.classList.remove('active'));
        if (wasActive) {
          // Deselect: return to default Blossom palette
          currentMood = 'default';
          targetMood = moods.default;
        } else {
          // Select new mood
          currentMood = btn.dataset.mood;
          targetMood = moods[currentMood];
          btn.classList.add('active');
        }
      });
    });

    // ==============================================================
    //  CLICK PARTICLE BURSTS
    //  Every click on the page spawns 6 to 10 colored circles that
    //  fly outward using CSS animations. The particle colors come
    //  from the active mood's palette.
    // ==============================================================
    let clickCount = 0;
    const countEl = document.getElementById('click-count');

    document.body.addEventListener('click', (e) => {
      const colors = targetMood.particles;
      const count = 6 + Math.floor(Math.random() * 5);
      for (let i = 0; i < count; i++) {
        const p = document.createElement('div');
        p.classList.add('particle');
        const size = 5 + Math.random() * 12;
        // Random direction for each particle via CSS custom properties
        const dx = (Math.random() - 0.5) * 200;
        const dy = -50 - Math.random() * 180;
        p.style.setProperty('--dx', dx + 'px');
        p.style.setProperty('--dy', dy + 'px');
        p.style.width = size + 'px';
        p.style.height = size + 'px';
        p.style.left = (e.clientX - size / 2) + 'px';
        p.style.top = (e.clientY - size / 2) + 'px';
        p.style.background = colors[Math.floor(Math.random() * colors.length)];
        document.body.appendChild(p);
        // Remove the particle element after its animation completes
        setTimeout(() => p.remove(), 2000);
      }
      clickCount += count;
      countEl.textContent = clickCount;
    });

    // ==============================================================
    //  DRAWING CANVAS SETUP
    // ==============================================================
    const drawCanvas = document.getElementById('draw-canvas');
    const drawCtx = drawCanvas.getContext('2d');
    let drawing = false;      // Whether the user is currently drawing
    let lastPos = null;       // Last cursor position for connected strokes
    let brushMode = 'thin';   // Currently selected brush type
    let brushColorOverride = null; // null = use mood color; string = manual color

    // Scale the canvas display size responsively (internal resolution stays 900x500)
    function resizeDrawCanvas() {
      const maxW = Math.min(900, window.innerWidth - 40);
      drawCanvas.style.width = maxW + 'px';
      drawCanvas.style.height = (maxW * (500/900)) + 'px';
    }

    // Fill canvas with a dark background so saved PNGs aren't transparent
    function fillCanvasBackground() {
      drawCtx.fillStyle = '#141820';
      drawCtx.fillRect(0, 0, drawCanvas.width, drawCanvas.height);
    }
    fillCanvasBackground();
    resizeDrawCanvas();
    window.addEventListener('resize', resizeDrawCanvas);

    // Convert mouse/touch screen coordinates to canvas pixel coordinates
    function getDrawPos(e) {
      const rect = drawCanvas.getBoundingClientRect();
      const touch = e.touches ? e.touches[0] : e;
      return {
        x: (touch.clientX - rect.left) * (drawCanvas.width / rect.width),
        y: (touch.clientY - rect.top) * (drawCanvas.height / rect.height),
      };
    }

    // Returns the current brush color: either user-selected or mood-linked
    function getBrushColor(alpha) {
      if (brushColorOverride) return brushColorOverride;
      const [r, g, b] = liveAccent;
      return `rgba(${r|0},${g|0},${b|0},${alpha || 0.8})`;
    }

    // ==============================================================
    //  13 BRUSH TYPES
    //  Each brush has a name (for the button) and a draw function
    //  that receives the canvas context, position, and last position.
    // ==============================================================
    const brushTypes = [
      {
        name: 'Thin',
        // Simple small circle at cursor position
        draw(ctx, pos) {
          ctx.fillStyle = getBrushColor(0.9);
          ctx.beginPath();
          ctx.arc(pos.x, pos.y, 2, 0, Math.PI * 2);
          ctx.fill();
        }
      },
      {
        name: 'Thick',
        // Larger circle for bold strokes
        draw(ctx, pos) {
          ctx.fillStyle = getBrushColor(0.8);
          ctx.beginPath();
          ctx.arc(pos.x, pos.y, 8, 0, Math.PI * 2);
          ctx.fill();
        }
      },
      {
        name: 'Spray',
        // Scattered random dots around the cursor (airbrush effect)
        draw(ctx, pos) {
          ctx.fillStyle = getBrushColor(0.5);
          for (let i = 0; i < 15; i++) {
            const ox = (Math.random() - 0.5) * 35;
            const oy = (Math.random() - 0.5) * 35;
            ctx.beginPath();
            ctx.arc(pos.x + ox, pos.y + oy, 1 + Math.random(), 0, Math.PI * 2);
            ctx.fill();
          }
        }
      },
      {
        name: 'Glow',
        // Soft radial gradient that creates a neon glow effect
        draw(ctx, pos) {
          const grad = ctx.createRadialGradient(pos.x, pos.y, 0, pos.x, pos.y, 18);
          grad.addColorStop(0, getBrushColor(0.6));
          grad.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(pos.x, pos.y, 18, 0, Math.PI * 2);
          ctx.fill();
        }
      },
      {
        name: 'Square',
        // Draws filled squares instead of circles
        draw(ctx, pos) {
          ctx.fillStyle = getBrushColor(0.8);
          ctx.fillRect(pos.x - 5, pos.y - 5, 10, 10);
        }
      },
      {
        name: 'Diamond',
        // Rotated square creating a diamond shape
        draw(ctx, pos) {
          ctx.fillStyle = getBrushColor(0.8);
          ctx.save();
          ctx.translate(pos.x, pos.y);
          ctx.rotate(Math.PI / 4); // 45 degree rotation
          ctx.fillRect(-5, -5, 10, 10);
          ctx.restore();
        }
      },
      {
        name: 'Star',
        // Five-pointed star stamp at each cursor point
        draw(ctx, pos) {
          ctx.fillStyle = getBrushColor(0.85);
          ctx.beginPath();
          for (let i = 0; i < 5; i++) {
            const angle = (i * 4 * Math.PI) / 5 - Math.PI / 2;
            const r = 7;
            const method = i === 0 ? 'moveTo' : 'lineTo';
            ctx[method](pos.x + Math.cos(angle) * r, pos.y + Math.sin(angle) * r);
          }
          ctx.closePath();
          ctx.fill();
        }
      },
      {
        name: 'Ribbon',
        // Connected line from last position to current (ribbon effect)
        draw(ctx, pos, last) {
          ctx.strokeStyle = getBrushColor(0.7);
          ctx.lineWidth = 3;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(last ? last.x : pos.x, last ? last.y : pos.y);
          ctx.lineTo(pos.x, pos.y);
          ctx.stroke();
        }
      },
      {
        name: 'Splatter',
        // Random sized dots scattered in a wide radius (paint splatter)
        draw(ctx, pos) {
          for (let i = 0; i < 8; i++) {
            const angle = Math.random() * Math.PI * 2;
            const dist = Math.random() * 25;
            const size = 1 + Math.random() * 4;
            ctx.fillStyle = getBrushColor(0.3 + Math.random() * 0.5);
            ctx.beginPath();
            ctx.arc(
              pos.x + Math.cos(angle) * dist,
              pos.y + Math.sin(angle) * dist,
              size, 0, Math.PI * 2
            );
            ctx.fill();
          }
        }
      },
      {
        name: 'Dash',
        // Short horizontal dashes along the stroke path
        draw(ctx, pos) {
          ctx.strokeStyle = getBrushColor(0.8);
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(pos.x - 6, pos.y);
          ctx.lineTo(pos.x + 6, pos.y);
          ctx.stroke();
        }
      },
      {
        name: 'Fur',
        // Multiple thin lines radiating outward (fur/hair texture)
        draw(ctx, pos) {
          ctx.strokeStyle = getBrushColor(0.4);
          ctx.lineWidth = 0.5;
          for (let i = 0; i < 6; i++) {
            const angle = Math.random() * Math.PI * 2;
            const len = 5 + Math.random() * 12;
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
            ctx.lineTo(pos.x + Math.cos(angle) * len, pos.y + Math.sin(angle) * len);
            ctx.stroke();
          }
        }
      },
      {
        name: 'Pixel',
        // Snaps to a 6px grid for a retro pixelated look
        draw(ctx, pos) {
          ctx.fillStyle = getBrushColor(0.9);
          const grid = 6;
          const gx = Math.floor(pos.x / grid) * grid;
          const gy = Math.floor(pos.y / grid) * grid;
          ctx.fillRect(gx, gy, grid, grid);
        }
      },
      {
        name: 'Calligraphy',
        // Angled ellipse that mimics a calligraphy pen nib
        draw(ctx, pos) {
          ctx.fillStyle = getBrushColor(0.85);
          ctx.save();
          ctx.translate(pos.x, pos.y);
          ctx.rotate(-Math.PI / 6); // 30 degree tilt
          ctx.beginPath();
          ctx.ellipse(0, 0, 8, 2, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      },
    ];

    // ==============================================================
    //  13 COLOR PALETTE + MOOD OPTION
    //  "Mood" uses the live accent color from the active mood.
    //  The other 13 are fixed color swatches the user can pick.
    // ==============================================================
    const colorPalette = [
      { name: 'Mood',    hex: null },           // null = use mood accent color
      { name: '',        hex: '#FFFFFF' },       // White
      { name: '',        hex: '#2962FF' },       // Electric Blue (Blossom)
      { name: '',        hex: '#7EB8FF' },       // Light Blue (Blossom)
      { name: '',        hex: '#3DFFC0' },       // Mint Green (Blossom)

      { name: '',        hex: '#7C4DFF' },       // Deep Purple

    ];

    // ==============================================================
    //  BUILD BRUSH + COLOR UI
    //  Dynamically creates buttons for each brush type and color
    //  swatch, and wires up click handlers to select them.
    // ==============================================================
    const brushRow = document.getElementById('brush-row');
    const colorRow = document.getElementById('color-row');

    // Create a button for each brush type
    brushTypes.forEach((b, i) => {
      const btn = document.createElement('button');
      btn.textContent = b.name;
      btn.dataset.brush = i;
      if (i === 0) btn.classList.add('active-tool'); // Default: Thin
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        brushMode = i;
        // Update active state visual
        brushRow.querySelectorAll('button').forEach(x => x.classList.remove('active-tool'));
        btn.classList.add('active-tool');
      });
      brushRow.appendChild(btn);
    });

    // Create a swatch button for each color
    colorPalette.forEach((c, i) => {
      const btn = document.createElement('button');
      if (c.hex) {
        // Colored circular swatch
        btn.className = 'color-swatch';
        btn.style.background = c.hex;
        btn.title = c.hex;
      } else {
        // "Mood" text button (uses the live accent color)
        btn.textContent = c.name;
        btn.title = 'Use mood color';
      }
      if (i === 0) btn.classList.add('active-tool'); // Default: Mood
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        brushColorOverride = c.hex; // null for mood, hex string for fixed color
        colorRow.querySelectorAll('button').forEach(x => x.classList.remove('active-tool'));
        btn.classList.add('active-tool');
      });
      colorRow.appendChild(btn);
    });

    // ==============================================================
    //  DRAWING ENGINE
    //  Handles mouse and touch events to draw on the canvas using
    //  the currently selected brush type and color.
    // ==============================================================

    // Dispatches to the active brush type's draw function
    function drawStroke(pos) {
      const brush = brushTypes[brushMode] || brushTypes[0];
      brush.draw(drawCtx, pos, lastPos);
      lastPos = pos;
    }

    // Mouse events for desktop drawing
    drawCanvas.addEventListener('mousedown', (e) => {
      e.stopPropagation();
      drawing = true;
      lastPos = null;
      drawStroke(getDrawPos(e));
    });
    drawCanvas.addEventListener('mousemove', (e) => {
      if (drawing) drawStroke(getDrawPos(e));
    });
    drawCanvas.addEventListener('mouseup', () => { drawing = false; lastPos = null; });
    drawCanvas.addEventListener('mouseleave', () => { drawing = false; lastPos = null; });

    // Touch events for mobile drawing
    drawCanvas.addEventListener('touchstart', (e) => {
      e.preventDefault(); e.stopPropagation();
      drawing = true; lastPos = null;
      drawStroke(getDrawPos(e));
    });
    drawCanvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      if (drawing) drawStroke(getDrawPos(e));
    });
    drawCanvas.addEventListener('touchend', () => { drawing = false; lastPos = null; });

    // Clear button wipes the drawing canvas
    document.getElementById('btn-clear').addEventListener('click', (e) => {
      e.stopPropagation();
      drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
      fillCanvasBackground();
    });

    // ==============================================================
    //  SAVE DRAWING AS PNG
    //  Converts the canvas to a PNG data URL and triggers a download.
    // ==============================================================
    document.getElementById('btn-save').addEventListener('click', (e) => {
      e.stopPropagation();
      const link = document.createElement('a');
      link.download = 'mood-room-drawing.png';
      link.href = drawCanvas.toDataURL('image/png');
      link.click();
    });

    // Fisher-Yates shuffle: returns a new randomly ordered copy of the array
    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    // Build 6 cards with random facts and Blossom icon fronts
    function buildCards() {
      const grid = document.getElementById('card-grid');
      grid.innerHTML = '';
      const picked = shuffle(snappleFacts).slice(0, 6); // Pick 6 random facts
      picked.forEach((fact, i) => {
        const icon = cardIcons[i % cardIcons.length]; // Cycle through icons
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-inner">
            <div class="card-front">
              ${icon}
              <span class="label">Click to flip</span>
            </div>
            <div class="card-back">
              <div class="fact-label">Snapple Real Fact</div>
              ${fact}
            </div>
          </div>`;
        grid.appendChild(card);
      });
      initCardListeners(); // Attach flip event handlers to the new cards
    }

    // ==============================================================
    //  CARD FLIP EVENT HANDLING
    //  Simple click-to-flip. No mousemove tilt effect, which was
    //  previously causing unreliable flip behavior.
    // ==============================================================
    function initCardListeners() {
      document.querySelectorAll('.card').forEach(card => {
        // Click to toggle the .flipped class (triggers CSS 3D rotation)
        card.addEventListener('click', (e) => {
          e.stopPropagation();
          card.classList.toggle('flipped');
        });

        // Touch support: tap to flip on mobile
        card.addEventListener('touchend', (e) => {
          e.stopPropagation();
          e.preventDefault();
          card.classList.toggle('flipped');
        });
      });
    }

    // Shuffle button: deals 6 new random facts from the pool
    document.getElementById('btn-shuffle').addEventListener('click', (e) => {
      e.stopPropagation();
      buildCards();
    });

    // Build the initial set of cards on page load
    buildCards();

    // ==============================================================
    //  MAIN ANIMATION LOOP
    //  Calls drawBg() every frame via requestAnimationFrame to keep
    //  the background particles and color transitions running smoothly.
    // ==============================================================
    function animate(time) {
      drawBg(time);
      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);
  </script>
