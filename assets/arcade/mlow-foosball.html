<style>
:root{
  --ink:#0A1220; --white:#FFFFFF; --cloud:#F0F4F8;
  --electric:#2962FF; --cyan:#22D3EE; --sky:#7EB8FF; --mint:#3DFFC0;
  --slate:#8899AA; --slate-dark:#3A4654; --slate-darker:#1C2230; --soft-ink:#121A2A;
  --font-display: Georgia, 'Times New Roman', serif;
  --font-body: Calibri, 'Segoe UI', -apple-system, system-ui, sans-serif;
  --font-mono: Consolas, 'SF Mono', Menlo, monospace;
  --r-md:14px; --r-lg:22px; --r-pill:999px;
  --accent:var(--electric);
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--ink);color:var(--white);font-family:var(--font-body);}
#gl{position:fixed;inset:0;display:block;}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:10;}
.hidden{display:none !important;}

/* ---------- START ---------- */
#start{background:radial-gradient(120% 90% at 50% 8%, rgba(28,34,48,0.86) 0%, rgba(8,14,26,0.93) 62%);flex-direction:column;gap:0;text-align:center;padding:24px;}
.icon-row{display:flex;gap:16px;margin:0 0 26px;opacity:.6;}
.icon-row img{width:19px;height:19px;}
.eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.32em;color:var(--slate);text-transform:uppercase;display:flex;align-items:center;gap:10px;justify-content:center;}
.eyebrow img{width:14px;height:14px;opacity:.85;}
#start .logo{width:min(300px,58vw);margin:0 0 18px;}
#start h1{font-family:var(--font-display);font-weight:700;font-size:clamp(46px,9vw,104px);letter-spacing:.02em;line-height:1.02;margin:10px 0 6px;}
#start h1 .thin{color:var(--electric);}
#start .sub{font-family:var(--font-mono);font-size:12px;letter-spacing:.22em;color:var(--slate);text-transform:uppercase;margin-bottom:30px;}
.modes{display:flex;gap:10px;margin-bottom:26px;}
.mode-btn{font-family:var(--font-mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--slate);background:transparent;border:1.5px solid var(--slate-dark);border-radius:var(--r-pill);padding:11px 26px;cursor:pointer;transition:all 160ms cubic-bezier(.2,.8,.2,1);}
.mode-btn.active{color:var(--ink);background:var(--white);border-color:var(--white);}
.mode-btn.active.wild{background:var(--cyan);border-color:var(--cyan);color:var(--ink);}
#playBtn{font-family:var(--font-display);font-size:24px;letter-spacing:.06em;color:var(--white);background:var(--electric);border:none;border-radius:var(--r-md);padding:16px 72px;cursor:pointer;transition:transform 160ms cubic-bezier(.34,1.56,.64,1), background 160ms;}
#playBtn:hover{transform:translateY(-2px) scale(1.03);}
.controls-hint{margin-top:30px;display:flex;gap:22px;flex-wrap:wrap;justify-content:center;max-width:640px;}
.hint{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--slate);}
.key{font-family:var(--font-mono);font-size:11px;color:var(--cloud);border:1px solid var(--slate-dark);border-radius:6px;padding:3px 8px;background:var(--soft-ink);}
.footer-links{position:absolute;bottom:20px;font-family:var(--font-mono);font-size:10px;letter-spacing:.24em;color:var(--slate-dark);text-transform:uppercase;}

/* ---------- HUD ---------- */
#hud{pointer-events:none;z-index:5;}
#scoreboard{position:fixed;top:14px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:14px;background:rgba(10,18,32,.8);border:1.5px solid var(--slate-darker);border-radius:var(--r-pill);padding:8px 20px;backdrop-filter:blur(6px);}
.team-tag{font-family:var(--font-mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;}
.team-tag.blue{color:var(--sky);}
.team-tag.turq{color:var(--cyan);}
.tag-ico{width:13px;height:13px;opacity:.85;}
.score-num{font-family:var(--font-display);font-size:30px;font-weight:700;min-width:34px;text-align:center;}
#clock{font-family:var(--font-mono);font-size:11px;color:var(--slate);letter-spacing:.14em;min-width:52px;text-align:center;}
#rodDock{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:8px;pointer-events:auto;}
.rod-chip{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;color:var(--slate);background:rgba(10,18,32,.75);border:1.5px solid var(--slate-darker);border-radius:var(--r-md);padding:9px 14px;cursor:pointer;transition:all 140ms;}
.rod-chip.sel{color:var(--white);border-color:var(--accent);background:rgba(41,98,255,.18);}
.rod-chip.auto.sel{border-color:var(--cyan);color:var(--cyan);background:rgba(34,211,238,.1);}
#wm{position:fixed;top:16px;left:18px;width:96px;opacity:.35;pointer-events:none;}
#camHint{position:fixed;top:18px;right:18px;font-family:var(--font-mono);font-size:10px;letter-spacing:.18em;color:var(--slate-dark);text-transform:uppercase;text-align:right;line-height:1.9;}
#kickBtn{position:fixed;right:20px;bottom:76px;width:88px;height:88px;border-radius:50%;border:2px solid var(--accent);background:rgba(41,98,255,.16);color:var(--white);font-family:var(--font-display);font-size:17px;letter-spacing:.04em;pointer-events:auto;display:none;}
.touch #kickBtn{display:block;}

/* ---------- FLASH / END ---------- */
#flash{flex-direction:column;gap:6px;pointer-events:none;z-index:20;background:transparent;opacity:0;transition:opacity 200ms;}
#flash.show{opacity:1;}
#flashTxt{font-family:var(--font-display);font-weight:700;font-size:clamp(60px,12vw,150px);letter-spacing:.03em;text-shadow:0 8px 60px rgba(13,13,13,.9);}
#flashSub{font-family:var(--font-mono);font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--cloud);}
#end{background:rgba(8,14,26,.9);flex-direction:column;gap:8px;text-align:center;z-index:30;}
#end img.logo{width:min(240px,50vw);margin-bottom:20px;}
#endTitle{font-family:var(--font-display);font-weight:700;font-size:clamp(52px,9vw,110px);line-height:1;}
#endScore{font-family:var(--font-display);font-size:34px;color:var(--cloud);margin:8px 0 2px;}
#endStats{font-family:var(--font-mono);font-size:12px;letter-spacing:.2em;color:var(--slate);text-transform:uppercase;margin-bottom:28px;}
#againBtn{font-family:var(--font-display);font-size:21px;color:var(--white);background:var(--electric);border:none;border-radius:var(--r-md);padding:14px 58px;cursor:pointer;}
#pause{background:rgba(8,14,26,.84);flex-direction:column;gap:14px;z-index:25;}
#pause h2{font-family:var(--font-display);font-size:56px;}
#pause p{font-family:var(--font-mono);font-size:12px;letter-spacing:.2em;color:var(--slate);text-transform:uppercase;}
/* compact layout for the 480x720 X player frame + phones */
@media (max-width:540px){
  #camHint{display:none;}
  #wm{width:62px;}
  #scoreboard{gap:8px;padding:6px 12px;top:8px;}
  .score-num{font-size:22px;min-width:24px;}
  .rod-chip{padding:7px 8px;font-size:10px;border-radius:10px;}
  #rodDock{bottom:10px;gap:5px;}
}
</style>
<style id="ny-mobile">html{-webkit-tap-highlight-color:transparent}button,[role=button],a,label{touch-action:manipulation;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}#gl,canvas{touch-action:none}</style></head>
<body>
<canvas id="gl"></canvas>

<div id="start" class="overlay">
  <div class="eyebrow"><img id="eb1" alt="">BLOSSOM ARCADE<img id="eb2" alt=""></div>
  <img class="logo" id="startLogo" alt="MLOW">
  <h1>FOOS<span class="thin">BALL</span></h1>
  <div class="sub">Daylight vs Vault &middot; Grown on the Table</div>
  <div class="icon-row">
    <img id="ir1" alt=""><img id="ir2" alt=""><img id="ir3" alt=""><img id="ir4" alt=""><img id="ir5" alt=""><img id="ir6" alt=""><img id="ir7" alt="">
  </div>
  <div class="modes">
    <button class="mode-btn active" id="modeGarden">Garden</button>
    <button class="mode-btn" id="modeWild">Wild</button>
  </div>
  <button id="playBtn">Play</button>
  <div class="controls-hint">
    <span class="hint"><span class="key">Mouse / W S</span> move rod</span>
    <span class="hint"><span class="key">Click / Space</span> kick</span>
    <span class="hint"><span class="key">1 to 4</span> select rod</span>
    <span class="hint"><span class="key">Q</span> auto-rod</span>
    <span class="hint"><span class="key">C</span> camera</span>
    <span class="hint"><span class="key">M</span> sound</span>
  </div>
  <div class="footer-links">MLOW.XYZ &middot; MLOW.NYC</div>
</div>

<div id="hud" class="overlay hidden">
  <img id="wm" alt="">
  <div id="scoreboard">
    <img class="tag-ico" id="tagD" alt="">
    <span class="team-tag blue">Daylight</span>
    <span class="score-num" id="s0">0</span>
    <span id="clock">0:00</span>
    <span class="score-num" id="s1">0</span>
    <span class="team-tag turq">Vault</span>
    <img class="tag-ico" id="tagV" alt="">
  </div>
  <div id="camHint">C &middot; camera<br>P &middot; pause</div>
  <div id="rodDock">
    <button class="rod-chip" data-rod="0">1 &middot; KEEP</button>
    <button class="rod-chip" data-rod="1">2 &middot; DEF</button>
    <button class="rod-chip" data-rod="2">3 &middot; MID</button>
    <button class="rod-chip" data-rod="3">4 &middot; ATT</button>
    <button class="rod-chip auto sel" data-rod="auto">AUTO</button>
  </div>
  <button id="kickBtn">KICK</button>
</div>

<div id="flash" class="overlay hidden"><div id="flashTxt">SCORED.</div><div id="flashSub"></div></div>

<div id="end" class="overlay hidden">
  <img class="logo" id="endLogo" alt="MLOW">
  <div id="endTitle">GROWN.</div>
  <div id="endScore">5 to 3</div>
  <div id="endStats"></div>
  <button id="againBtn">Again</button>
</div>

<div id="pause" class="overlay hidden"><h2>PAUSED.</h2><p>press P to resume</p></div>

function lerp(a,b,t){ return a+(b-a)*t; }
function el(id){ return document.getElementById(id); }

/* ---------------- Audio (WebAudio synth) ---------------- */
let AC = null;
function audio(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
function blip(freq, dur, type, vol, when){
  const ac = audio(); if(!ac || muted) return;
  const t = ac.currentTime + (when||0);
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type||'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(vol||0.15, t); g.gain.exponentialRampToValueAtTime(0.001, t+dur);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+dur+0.02);
}
function thock(vol){
  const ac = audio(); if(!ac || muted) return;
  const t = ac.currentTime;
  const buf = ac.createBuffer(1, 2048, ac.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<2048;i++) d[i] = (Math.random()*2-1)*Math.pow(1-i/2048,2.4);
  const src = ac.createBufferSource(); src.buffer = buf;
  const f = ac.createBiquadFilter(); f.type='lowpass'; f.frequency.value=900;
  const g = ac.createGain(); g.gain.value = vol||0.5;
  src.connect(f); f.connect(g); g.connect(ac.destination); src.start(t);
  blip(120, 0.09, 'sine', (vol||0.5)*0.5);
}
function goalSound(win){
  if(win){ blip(523,0.16,'triangle',0.22); blip(659,0.16,'triangle',0.2,0.11); blip(784,0.3,'triangle',0.22,0.22); }
  else { blip(311,0.2,'sawtooth',0.12); blip(233,0.34,'sawtooth',0.12,0.14); }
}

/* ---------------- Texture builders ---------------- */
function recolor(img, hex){
  const c = document.createElement('canvas'); c.width = img.width; c.height = img.height;
  const g = c.getContext('2d');
  g.drawImage(img,0,0);
  g.globalCompositeOperation = 'source-in';
  g.fillStyle = hex; g.fillRect(0,0,c.width,c.height);
  return c;
}
function bloomTex(icon, hex){
  const key = icon + hex;
  if(!bloomTexCache[key]) bloomTexCache[key] = new THREE.CanvasTexture(recolor(images.blooms[icon], hex));
  return bloomTexCache[key];
}
function pitchTexture(){
  const W=2048, H=1200, c=document.createElement('canvas'); c.width=W; c.height=H;
  const g = c.getContext('2d');
  // cloud pitch
  g.fillStyle = '#F0F4F8'; g.fillRect(0,0,W,H);
  // subtle mow stripes, blue-biased
  for(let i=0;i<8;i++){ if(i%2===0){ g.fillStyle='rgba(41,98,255,0.035)'; g.fillRect(i*W/8,0,W/8,H); } }
  const sx = W/(2*HX), sz = H/(2*HZ);
  // garden scatter — generative blossom pattern across the pitch
  for(let i=0;i<38;i++){
    const icon = images.blooms[i%7];
    const hex = ['#2962FF','#22D3EE','#7EB8FF'][i%3];
    const s = 55 + ((i*97)%110);
    const px = 60 + ((i*769)%(W-140));
    const py = 40 + ((i*521)%(H-110));
    g.save();
    g.translate(px+s/2, py+s/2);
    g.rotate(((i*131)%360)*Math.PI/180);
    g.globalAlpha = 0.07 + ((i*29)%5)*0.013;
    g.drawImage(recolor(icon,hex), -s/2, -s/2, s, s);
    g.restore();
  }
  g.globalAlpha = 1;
  g.strokeStyle = '#1C2230'; g.lineWidth = 7;
  g.strokeRect(14,14,W-28,H-28);
  // halfway line
  g.beginPath(); g.moveTo(W/2,14); g.lineTo(W/2,H-14); g.stroke();
  // center circle — electric
  g.strokeStyle = '#2962FF'; g.lineWidth = 9;
  g.beginPath(); g.arc(W/2,H/2, 13*sx, 0, Math.PI*2); g.stroke();
  // penalty boxes
  g.strokeStyle = '#1C2230'; g.lineWidth = 7;
  const boxW = 16*sx, boxH = 2*GOAL_HALF*sz*1.35;
  g.strokeRect(14, H/2-boxH/2, boxW, boxH);
  g.strokeRect(W-14-boxW, H/2-boxH/2, boxW, boxH);
  // goal mouths accent — electric vs turquoise
  g.fillStyle = 'rgba(41,98,255,0.10)'; g.fillRect(14, H/2-GOAL_HALF*sz, 6*sx, 2*GOAL_HALF*sz);
  g.fillStyle = 'rgba(34,211,238,0.12)'; g.fillRect(W-14-6*sx, H/2-GOAL_HALF*sz, 6*sx, 2*GOAL_HALF*sz);
  // blossom watermark in center circle
  const b = images.blooms[0], bs = 11*sx*1.15;
  g.globalAlpha = 0.14;
  g.drawImage(recolor(b,'#2962FF'), W/2-bs/2, H/2-bs/2, bs, bs);
  g.globalAlpha = 1;
  // eye at center spot
  const e = images.eye, es = 4.4*sx;
  g.drawImage(e, W/2-es/2, H/2-es/2, es, es);
  const tx = new THREE.CanvasTexture(c);
  tx.anisotropy = 8; return tx;
}
function ballTexture(){
  const W=1024,H=512,c=document.createElement('canvas'); c.width=W;c.height=H;
  const g=c.getContext('2d');
  g.fillStyle='#F7FAFC'; g.fillRect(0,0,W,H);
  // faint sky-blue seams
  g.strokeStyle='rgba(126,184,255,0.5)'; g.lineWidth=3;
  g.beginPath(); g.moveTo(0,H/2); g.lineTo(W,H/2); g.stroke();
  // turquoise blossoms between the eyes
  g.globalAlpha = 0.85;
  const bl = recolor(images.blooms[2], '#22D3EE');
  g.drawImage(bl, W*0.5-60, H/2-60, 120, 120);
  g.drawImage(bl, -55, H/2-55, 110, 110);
  g.drawImage(bl, W-55, H/2-55, 110, 110);
  g.globalAlpha = 1;
  const e = images.eye, s = 300;
  g.drawImage(e, W*0.25-s/2, H/2-s/2, s, s);
  g.drawImage(e, W*0.75-s/2, H/2-s/2, s, s);
  const tx = new THREE.CanvasTexture(c);
  tx.anisotropy = 8; return tx;
}
function logoBoardTexture(){
  const W=1024,H=256,c=document.createElement('canvas'); c.width=W;c.height=H;
  const g=c.getContext('2d');
  g.fillStyle='#0C1424'; g.fillRect(0,0,W,H);
  const img = images.logo, lw = 460, lh = lw*(img.height/img.width);
  g.globalAlpha = 0.92;
  g.drawImage(img, W/2-lw/2, H/2-lh/2, lw, lh);
  g.globalAlpha = 1;
  const tx = new THREE.CanvasTexture(c); tx.anisotropy = 8; return tx;
}
function blossomBoardTexture(){
  // BLOSSOM wordmark board — Georgia caps, wide tracking, flanked by icons
  const W=1024,H=256,c=document.createElement('canvas'); c.width=W;c.height=H;
  const g=c.getContext('2d');
  g.fillStyle='#0C1424'; g.fillRect(0,0,W,H);
  const word='BLOSSOM', track=26;
  g.font='bold 104px Georgia, serif'; g.fillStyle='#FFFFFF'; g.textBaseline='middle';
  let tw=0;
  for(const ch of word) tw += g.measureText(ch).width + track;
  tw -= track;
  const ico=88, gap=52, total=tw+2*(ico+gap);
  let x=(W-total)/2;
  g.drawImage(recolor(images.blooms[0],'#22D3EE'), x, H/2-ico/2, ico, ico); x += ico+gap;
  for(const ch of word){ g.fillText(ch, x, H/2+6); x += g.measureText(ch).width + track; }
  x += gap - track;
  g.drawImage(recolor(images.blooms[4],'#22D3EE'), x, H/2-ico/2, ico, ico);
  const tx=new THREE.CanvasTexture(c); tx.anisotropy=8; return tx;
}
function glowTexture(rgb){
  const c=document.createElement('canvas'); c.width=c.height=128;
  const g=c.getContext('2d');
  const gr=g.createRadialGradient(64,64,2,64,64,62);
  gr.addColorStop(0,'rgba('+rgb+',0.55)');
  gr.addColorStop(0.55,'rgba('+rgb+',0.16)');
  gr.addColorStop(1,'rgba('+rgb+',0)');
  g.fillStyle=gr; g.fillRect(0,0,128,128);
  return new THREE.CanvasTexture(c);
}

/* ---------------- Scene build ---------------- */
function buildScene(){
  scene = new THREE.Scene();
  scene.background = new THREE.Color(COL.ink);
  scene.fog = new THREE.Fog(COL.ink, 190, 420);

  camera = new THREE.PerspectiveCamera(46, innerWidth/innerHeight, 1, 800);

  // lights
  scene.add(new THREE.AmbientLight(0x8899AA, 0.5));
  const hemi = new THREE.HemisphereLight(0xC2CAD5, 0x0D0D0D, 0.35); scene.add(hemi);
  const key = new THREE.SpotLight(0xFFFFFF, 1.15, 500, 0.9, 0.45, 1.2);
  key.position.set(0, 150, 30); key.castShadow = true;
  key.shadow.mapSize.set(2048,2048); key.shadow.bias = -0.0004;
  scene.add(key); scene.add(key.target);
  const blueGlow = new THREE.PointLight(COL.electric, 0.8, 90); blueGlow.position.set(-HX-4, 16, 0); scene.add(blueGlow);
  const turqGlow = new THREE.PointLight(COL.cyan, 0.8, 90); turqGlow.position.set(HX+4, 16, 0); scene.add(turqGlow);

  // floor
  const floor = new THREE.Mesh(new THREE.CircleGeometry(400, 48),
    new THREE.MeshStandardMaterial({ color:0x0E1626, roughness:0.95, metalness:0 }));
  floor.rotation.x = -Math.PI/2; floor.position.y = -34; floor.receiveShadow = true;
  scene.add(floor);

  buildTable();
  buildBall();
  buildRods();
  buildGarden();
  buildGrass();
  buildFlowerStems();
  buildPetals();
  buildButterflies();
}

/* ---------------- Grass — one merged mesh, vertex-colored blades ---------------- */
function buildGrass(){
  const pos = [], col = [];
  // blues, turquoise, mint, sky — approx-linear RGB
  const palette = [[0.06,0.13,0.4],[0.09,0.3,1.0],[0.06,0.62,0.82],[0.14,1.0,0.62],[0.3,0.6,1.0]];
  let n = 0, tries = 0;
  while(n < 520 && tries < 4200){
    tries++;
    const x = (Math.random()-0.5)*560, z = (Math.random()-0.5)*480;
    if(Math.abs(x) < 98 && Math.abs(z) < 80) continue;
    const h = 3 + Math.random()*6.5, w = 0.5 + Math.random()*0.8;
    const dir = Math.random()*Math.PI*2, lean = (Math.random()-0.5)*3;
    const bx = Math.cos(dir)*w/2, bz = Math.sin(dir)*w/2;
    const tx = x + Math.cos(dir+1.57)*lean, tz = z + Math.sin(dir+1.57)*lean;
    pos.push(x-bx,-34,z-bz,  x+bx,-34,z+bz,  tx,-34+h,tz);
    const c = palette[(Math.random()*palette.length)|0], sh = 0.45 + Math.random()*0.55;
    for(let k=0;k<3;k++) col.push(c[0]*sh, c[1]*sh, c[2]*sh);
    n++;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  const mat = new THREE.MeshBasicMaterial({ vertexColors:true, side:THREE.DoubleSide, toneMapped:false, transparent:true, opacity:0.9 });
  scene.add(new THREE.Mesh(geo, mat));
}
/* ---------------- Stemmed flowers — blossom heads rising from the meadow ------- */
function buildFlowerStems(){
  const stemMat = new THREE.MeshBasicMaterial({ color:0x1C3A6E, toneMapped:false });
  const group = new THREE.Group();
  let n = 0, tries = 0;
  while(n < 70 && tries < 2200){
    tries++;
    const x = (Math.random()-0.5)*540, z = (Math.random()-0.5)*460;
    if(Math.abs(x) < 98 && Math.abs(z) < 80) continue;
    const h = 5 + Math.random()*9;
    const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.22, h, 5), stemMat);
    stem.position.set(x, -34 + h/2, z);
    group.add(stem);
    const icon = (Math.random()*7)|0, hex = BLOOM_HEXES[(Math.random()*BLOOM_HEXES.length)|0];
    const s = 2.2 + Math.random()*3.6;
    const mat = new THREE.MeshBasicMaterial({ map: bloomTex(icon, hex), transparent:true,
      side:THREE.DoubleSide, toneMapped:false, depthWrite:false });
    const p1 = new THREE.Mesh(new THREE.PlaneGeometry(s, s), mat);
    p1.position.set(x, -34 + h + s*0.38, z);
    p1.rotation.y = Math.random()*Math.PI;
    const p2 = p1.clone(); p2.rotation.y += Math.PI/2;
    group.add(p1); group.add(p2);
    n++;
  }
  scene.add(group);
}
/* ---------------- Butterflies — icon wings on looping flight paths ------------- */
let butterflies = [];
function buildButterflies(){
  for(let i=0;i<14;i++){
    const icon = (Math.random()*7)|0, hex = BLOOM_HEXES[(Math.random()*BLOOM_HEXES.length)|0];
    const mat = new THREE.MeshBasicMaterial({ map: bloomTex(icon, hex), transparent:true,
      side:THREE.DoubleSide, toneMapped:false, depthWrite:false });
    const g = new THREE.Group();
    const wingGeo = new THREE.PlaneGeometry(1.7, 1.7);
    wingGeo.rotateX(-Math.PI/2);        // lie flat
    wingGeo.translate(0.95, 0, 0);      // hinge at the spine
    const wl = new THREE.Mesh(wingGeo, mat);
    const wrMesh = new THREE.Mesh(wingGeo.clone(), mat);
    const wrWrap = new THREE.Group(); wrWrap.scale.x = -1; wrWrap.add(wrMesh);
    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 1.4, 4),
      new THREE.MeshBasicMaterial({ color:0x141B2E, toneMapped:false }));
    body.rotation.x = Math.PI/2;
    g.add(wl); g.add(wrWrap); g.add(body);
    g.scale.setScalar(0.9 + Math.random()*1.2);
    scene.add(g);
    butterflies.push({ g:g, wl:wl, wr:wrMesh,
      a: Math.random()*6.28, sp: (0.12+Math.random()*0.22)*(Math.random()<0.5?-1:1),
      rx: 75+Math.random()*100, rz: 58+Math.random()*85,
      h: 12+Math.random()*40, ph: Math.random()*6.28, fs: 6+Math.random()*5 });
  }
}
function updateButterflies(dt){
  for(let i=0;i<butterflies.length;i++){
    const b = butterflies[i];
    b.a += b.sp*dt;
    b.g.position.set(Math.cos(b.a)*b.rx, b.h + Math.sin(worldT*1.3+b.ph)*3.5, Math.sin(b.a)*b.rz);
    b.g.rotation.y = -b.a + (b.sp>0 ? -Math.PI/2 : Math.PI/2);
    const flap = 0.25 + Math.sin(worldT*b.fs + b.ph)*0.85;
    b.wl.rotation.z = flap; b.wr.rotation.z = flap;
  }
}

/* ---------------- The Garden — flowers everywhere ---------------- */
function buildGarden(){
  // flower bed scattered on the floor around the table
  const g = new THREE.Group();
  let placed = 0, tries = 0;
  while(placed < 110 && tries < 900){
    tries++;
    const x = (Math.random()-0.5)*540, z = (Math.random()-0.5)*470;
    if(Math.abs(x) < 95 && Math.abs(z) < 78) continue;  // keep the table clearing open
    const icon = (Math.random()*7)|0;
    const hex = BLOOM_HEXES[(Math.random()*BLOOM_HEXES.length)|0];
    const s = 7 + Math.random()*14;
    const m = new THREE.Mesh(new THREE.PlaneGeometry(s, s),
      new THREE.MeshBasicMaterial({ map: bloomTex(icon, hex), transparent:true,
        opacity: 0.28 + Math.random()*0.5, depthWrite:false, toneMapped:false }));
    m.rotation.x = -Math.PI/2;
    m.rotation.z = Math.random()*Math.PI*2;
    m.position.set(x, -33.6 + Math.random()*0.25, z);
    g.add(m);
    placed++;
  }
  scene.add(g);
}
function buildPetals(){
  // ambient blossoms drifting down through the arena
  for(let i=0;i<150;i++){
    const icon = (Math.random()*7)|0;
    const hex = BLOOM_HEXES[(Math.random()*BLOOM_HEXES.length)|0];
    const mat = new THREE.SpriteMaterial({ map: bloomTex(icon, hex), transparent:true,
      opacity: 0.2 + Math.random()*0.4, depthWrite:false, toneMapped:false });
    mat.rotation = Math.random()*Math.PI*2;
    const s = new THREE.Sprite(mat);
    const sc = 1.3 + Math.random()*3.4;
    s.scale.set(sc, sc, 1);
    s.position.set((Math.random()-0.5)*500, -30 + Math.random()*175, (Math.random()-0.5)*420);
    scene.add(s);
    petals.push({ s:s, vy: 2.5 + Math.random()*5.5, ph: Math.random()*6.28,
      sw: 2 + Math.random()*5, rs: -0.7 + Math.random()*1.4 });
  }
}
function updatePetals(dt){
  for(let i=0;i<petals.length;i++){
    const p = petals[i];
    p.s.position.y -= p.vy*dt;
    p.s.position.x += Math.sin(worldT*0.7 + p.ph)*p.sw*dt;
    p.s.material.rotation += p.rs*dt;
    if(p.s.position.y < -32){
      p.s.position.y = 135 + Math.random()*25;
      p.s.position.x = (Math.random()-0.5)*500;
      p.s.position.z = (Math.random()-0.5)*420;
    }
  }
}

function buildTable(){
  const T = new THREE.Group();
  const inkMat = new THREE.MeshStandardMaterial({ color:COL.softInk, roughness:0.62, metalness:0.18 });
  const railMat = new THREE.MeshStandardMaterial({ color:0x0C1424, roughness:0.5, metalness:0.25 });

  // pitch
  const pitch = new THREE.Mesh(new THREE.BoxGeometry(2*HX, 2, 2*HZ),
    new THREE.MeshStandardMaterial({ map: pitchTexture(), roughness:0.85 }));
  pitch.position.y = -1; pitch.receiveShadow = true; T.add(pitch);

  // side walls (long, along x) — MLOW logo + BLOSSOM wordmark boards on inner faces
  const wallH = 7.5, wallTh = 3;
  const boardTx = logoBoardTexture();
  const bloomBoardTx = blossomBoardTexture();
  [-1,1].forEach(function(sgn){
    const wall = new THREE.Mesh(new THREE.BoxGeometry(2*HX+2*wallTh, wallH, wallTh), railMat.clone());
    wall.position.set(0, wallH/2-0.5, sgn*(HZ+wallTh/2)); wall.castShadow = true; wall.receiveShadow = true;
    T.add(wall);
    // one MLOW board + one BLOSSOM board per side, mirrored across sides
    [-0.5,0.5].forEach(function(fx, bi){
      const useLogo = (sgn>0) ? bi===0 : bi===1;
      const board = new THREE.Mesh(new THREE.PlaneGeometry(42, 6.4),
        new THREE.MeshBasicMaterial({ map: useLogo ? boardTx : bloomBoardTx, toneMapped:false }));
      board.position.set(fx*2*HX*0.42, wallH/2-0.4, sgn*(HZ-0.12));
      board.rotation.y = sgn>0 ? Math.PI : 0;
      T.add(board);
    });
    // accent strip on top rail — electric near -x half, turquoise near +x half
    const stripB = new THREE.Mesh(new THREE.BoxGeometry(HX, 0.5, 0.6),
      new THREE.MeshBasicMaterial({ color:COL.electric, toneMapped:false }));
    stripB.position.set(-HX/2, wallH+0.05, sgn*(HZ+wallTh/2));
    T.add(stripB);
    const stripT = stripB.clone(); stripT.material = new THREE.MeshBasicMaterial({ color:COL.cyan, toneMapped:false });
    stripT.position.x = HX/2; T.add(stripT);
  });

  // end walls with goal opening
  [-1,1].forEach(function(sgn){
    const segW = HZ - GOAL_HALF;
    [-1,1].forEach(function(zsgn){
      const seg = new THREE.Mesh(new THREE.BoxGeometry(3, 7.5, segW), railMat.clone());
      seg.position.set(sgn*(HX+1.5), 3.25, zsgn*(GOAL_HALF+segW/2));
      seg.castShadow = true; T.add(seg);
    });
    // top bar over goal
    const bar = new THREE.Mesh(new THREE.BoxGeometry(3, 7.5-GOAL_H+2, 2*GOAL_HALF), railMat.clone());
    bar.position.set(sgn*(HX+1.5), GOAL_H + (7.5-GOAL_H+2)/2 - 1.5, 0); T.add(bar);

    // goal box
    const accent = sgn<0 ? COL.electric : COL.cyan;
    const gMat = new THREE.MeshStandardMaterial({ color:0x08101E, roughness:0.9 });
    const back = new THREE.Mesh(new THREE.BoxGeometry(1, GOAL_H, 2*GOAL_HALF), gMat);
    back.position.set(sgn*(HX+GOAL_DEPTH), GOAL_H/2, 0); T.add(back);
    // blossom on the goal back panel, facing the pitch
    const gb = new THREE.Mesh(new THREE.PlaneGeometry(7.5, 7.5),
      new THREE.MeshBasicMaterial({ map: bloomTex(sgn<0?3:5, sgn<0?'#2962FF':'#22D3EE'),
        transparent:true, opacity:0.85, toneMapped:false }));
    gb.position.set(sgn*(HX+GOAL_DEPTH-0.6), GOAL_H/2, 0);
    gb.rotation.y = sgn<0 ? Math.PI/2 : -Math.PI/2;
    T.add(gb);
    [-1,1].forEach(function(zsgn){
      const side = new THREE.Mesh(new THREE.BoxGeometry(GOAL_DEPTH, GOAL_H, 1), gMat);
      side.position.set(sgn*(HX+GOAL_DEPTH/2), GOAL_H/2, zsgn*GOAL_HALF); T.add(side);
    });
    const roof = new THREE.Mesh(new THREE.BoxGeometry(GOAL_DEPTH, 1, 2*GOAL_HALF), gMat);
    roof.position.set(sgn*(HX+GOAL_DEPTH/2), GOAL_H, 0); T.add(roof);
    // glowing goal frame
    const frameMat = new THREE.MeshBasicMaterial({ color:accent, toneMapped:false });
    const fTop = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.7, 2*GOAL_HALF+0.7), frameMat);
    fTop.position.set(sgn*(HX+0.4), GOAL_H, 0); T.add(fTop);
    [-1,1].forEach(function(zsgn){
      const post = new THREE.Mesh(new THREE.BoxGeometry(0.7, GOAL_H, 0.7), frameMat);
      post.position.set(sgn*(HX+0.4), GOAL_H/2, zsgn*GOAL_HALF); T.add(post);
    });
    // glow sprite in goal mouth
    const spr = new THREE.Sprite(new THREE.SpriteMaterial({
      map: glowTexture(sgn<0?'41,98,255':'34,211,238'),
      transparent:true, depthWrite:false, blending:THREE.AdditiveBlending }));
    spr.scale.set(26,20,1); spr.position.set(sgn*(HX+3), 5, 0); T.add(spr);
  });

  // cabinet body below pitch
  const body = new THREE.Mesh(new THREE.BoxGeometry(2*HX+10, 10, 2*HZ+10), inkMat);
  body.position.y = -7; body.castShadow = true; T.add(body);
  // angular legs
  const legGeo = new THREE.CylinderGeometry(2.6, 4.2, 24, 4);
  [-1,1].forEach(function(xs){ [-1,1].forEach(function(zs){
    const leg = new THREE.Mesh(legGeo, inkMat);
    leg.position.set(xs*(HX-6), -22, zs*(HZ-4)); leg.rotation.y = Math.PI/4;
    leg.castShadow = true; T.add(leg);
  });});
  scene.add(T);
}

function buildBall(){
  ballMesh = new THREE.Mesh(new THREE.SphereGeometry(BALL_R, 40, 28),
    new THREE.MeshStandardMaterial({ map: ballTexture(), roughness:0.32, metalness:0.05 }));
  ballMesh.castShadow = true;

function buildMan(team, icon){
  // The piece IS a blossom: stem body on the rod, big crossed-plane blossom head.
  const g = new THREE.Group();
  const bodyCol = team===0 ? COL.electric : COL.navy;
  const trimCol = team===0 ? COL.cloud : COL.cyan;
  const headHex = team===0 ? '#7EB8FF' : '#22D3EE';
  const bodyMat = new THREE.MeshStandardMaterial({ color:bodyCol, roughness:0.55, metalness:0.08, flatShading:true });
  const trimMat = new THREE.MeshStandardMaterial({ color:trimCol, roughness:0.4, metalness:0.15, flatShading:true });

  // blossom head — two crossed icon planes so it reads from every camera
  const headMat = new THREE.MeshBasicMaterial({ map: bloomTex(icon, headHex),
    transparent:true, side:THREE.DoubleSide, toneMapped:false, depthWrite:false });
  const h1 = new THREE.Mesh(new THREE.PlaneGeometry(3.3, 3.3), headMat);
  h1.position.y = 0.75;
  const h2 = h1.clone(); h2.rotation.y = Math.PI/2;
  g.add(h1); g.add(h2);
  // head core
  const core = new THREE.Mesh(new THREE.IcosahedronGeometry(0.55, 0), trimMat);
  core.position.y = 0.75; g.add(core);

  // stem torso — slim angular prism
  const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.85, 1.4, 4.2, 4), bodyMat);
  torso.rotation.y = Math.PI/4; torso.position.y = -2.4; torso.castShadow = true; g.add(torso);
  // shoulders bar (sits on rod)
  const shoulder = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.0, 3.0), bodyMat);
  shoulder.position.y = -0.4; g.add(shoulder);
  // leg + kicker foot
  const legM = new THREE.Mesh(new THREE.BoxGeometry(1.2, 2.3, 1.45), bodyMat);
  legM.position.y = -5.4; legM.castShadow = true; g.add(legM);
  const foot = new THREE.Mesh(new THREE.BoxGeometry(2.1, 1.15, 1.9), trimMat);
  foot.position.y = -6.9; foot.castShadow = true; g.add(foot);
  return g;
}

function buildRods(){
  rods = [];
  const chromeMat = new THREE.MeshStandardMaterial({ color:0xBFC9D4, roughness:0.22, metalness:0.92 });
  RODS_DEF.forEach(function(def, idx){
    const group = new THREE.Group();
    // steel rod spanning table + through walls
    const rodMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.55, 2*HZ+22, 14), chromeMat);
    rodMesh.rotation.x = Math.PI/2; rodMesh.castShadow = true;
    group.add(rodMesh);
    // handles both ends
    [-1,1].forEach(function(sgn){
      const hnd = new THREE.Mesh(new THREE.CylinderGeometry(1.15, 1.15, 6.5, 12),
        new THREE.MeshStandardMaterial({ color:COL.softInk, roughness:0.6 }));
      hnd.rotation.x = Math.PI/2; hnd.position.z = sgn*(HZ+14);
      group.add(hnd);
      const cap = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.2, 0.9, 12),
        new THREE.MeshStandardMaterial({ color: def.team===0?COL.electric:COL.cyan, roughness:0.35, emissive: def.team===0?COL.electric:COL.cyan, emissiveIntensity:0.35 }));
      cap.rotation.x = Math.PI/2; cap.position.z = sgn*(HZ+17.6);
      group.add(cap);
    });
    // men — carrier that slides in z and rotates around z
    const carrier = new THREE.Group();
    const men = [];
    for(let i=0;i<def.n;i++){
      const rel = (i-(def.n-1)/2)*def.s;
      const man = buildMan(def.team, ROD_ICONS[idx]);
      const spin = new THREE.Group();       // rotates around rod (z axis)
      spin.add(man);
      spin.position.z = rel;
      carrier.add(spin);
      men.push({ spin: spin, rel: rel });
    }
    group.add(carrier);
    group.position.set(def.x, ROD_Y, 0);
    // selection marker (hidden by default)
    const mark = new THREE.Mesh(new THREE.ConeGeometry(1.5, 2.6, 4),
      new THREE.MeshBasicMaterial({ color:COL.sky, toneMapped:false }));
    mark.rotation.x = Math.PI; mark.position.y = 8; mark.visible = false;
    group.add(mark);
    scene.add(group);
    rods.push({
      def: def, group: group, carrier: carrier, men: men, mark: mark,
      offset: 0, vOff: 0, target: 0, angle: 0, kickT: -1, kickCool: 0,
      aiBallZ: 0, aimErr: 0, aimT: 0
    });
  });
}

/* ---------------- Kick anim / physics ---------------- */
const K_BACK = 0.055, K_FWD = 0.085, K_RET = 0.17;
function startKick(rod){
  if(rod.kickT >= 0 || rod.kickCool > 0) return;
  rod.kickT = 0; rod.kickCool = 0.32;
  if(rod.def.team===0) stats.kicks++;
}
function kickAngle(t){
  if(t < K_BACK) return lerp(0, -0.95, t/K_BACK);
  if(t < K_BACK+K_FWD) return lerp(-0.95, 1.5, (t-K_BACK)/K_FWD);
  if(t < K_BACK+K_FWD+K_RET) return lerp(1.5, 0, (t-K_BACK-K_FWD)/K_RET);
  return 0;
}
function updateRodAnims(dt){
  rods.forEach(function(rod){
    rod.kickCool = Math.max(0, rod.kickCool - dt);
    if(rod.kickT >= 0){
      rod.kickT += dt;
      rod.angle = kickAngle(rod.kickT);
      if(rod.kickT > K_BACK+K_FWD+K_RET){ rod.kickT = -1; rod.angle = 0; }
    }
    // slide toward target
    const maxV = rod.def.team===0 ? 220 : MODE.aiSpeed;
    const d = rod.target - rod.offset;
    const step = clamp(d, -maxV*dt, maxV*dt);
    rod.vOff = step/Math.max(dt,1e-4);
    rod.offset = clamp(rod.offset + step, -rod.def.travel, rod.def.travel);
    // apply visuals
    const dir = rod.def.team===0 ? 1 : -1;
    rod.carrier.position.z = rod.offset;
    rod.men.forEach(function(m){ m.spin.rotation.z = -rod.angle*dir; });
    rod.mark.position.z = rod.offset;
  });
}
function rodForward(rod){ // true while kick swing is in the hitting window
  if(rod.kickT < 0) return false;
  const t = rod.kickT;
  return t >= K_BACK && t <= K_BACK + K_FWD + 0.03;
}
function stepPhysics(dt){
  // gravity + integrate
  ball.vy -= 320*dt;
  ball.x += ball.vx*dt; ball.z += ball.vz*dt; ball.y += ball.vy*dt;
  // pitch bounce
  if(ball.y < BALL_R){ ball.y = BALL_R; if(ball.vy < 0) ball.vy = -ball.vy*0.45; if(Math.abs(ball.vy)<8) ball.vy = 0; }
  // rolling friction
  const fr = Math.pow(0.32, dt);
  ball.vx *= fr; ball.vz *= fr;
  // side walls
  if(ball.z > HZ-BALL_R){ ball.z = HZ-BALL_R; ball.vz = -Math.abs(ball.vz)*0.78; wallTick(); }
  if(ball.z < -(HZ-BALL_R)){ ball.z = -(HZ-BALL_R); ball.vz = Math.abs(ball.vz)*0.78; wallTick(); }
  // end walls / goal mouth
  const inMouth = Math.abs(ball.z) < GOAL_HALF - BALL_R*0.4 && ball.y < GOAL_H - BALL_R*0.5;
  if(!inMouth){
    if(ball.x > HX-BALL_R){ ball.x = HX-BALL_R; ball.vx = -Math.abs(ball.vx)*0.78; wallTick(); }
    if(ball.x < -(HX-BALL_R)){ ball.x = -(HX-BALL_R); ball.vx = Math.abs(ball.vx)*0.78; wallTick(); }
  } else {
    // inside goal box containment
    if(ball.x > HX+GOAL_DEPTH-BALL_R){ ball.x = HX+GOAL_DEPTH-BALL_R; ball.vx = -Math.abs(ball.vx)*0.4; }
    if(ball.x < -(HX+GOAL_DEPTH-BALL_R)){ ball.x = -(HX+GOAL_DEPTH-BALL_R); ball.vx = Math.abs(ball.vx)*0.4; }
    if(Math.abs(ball.x) > HX+1 && Math.abs(ball.z) > GOAL_HALF-BALL_R){
      ball.z = clamp(ball.z, -(GOAL_HALF-BALL_R), GOAL_HALF-BALL_R); ball.vz *= -0.4;
    }
  }
  // goal detection
  if(goalCooldown <= 0){
    if(ball.x > HX+2.5){ onGoal(0); }
    else if(ball.x < -(HX+2.5)){ onGoal(1); }
  }
  // man collisions (skip while inside goal)
  if(Math.abs(ball.x) < HX-0.5) collideRods(dt);
}
let wallTickCool = 0;
function wallTick(){
  if(wallTickCool > 0) return; wallTickCool = 0.08;
  const sp = Math.hypot(ball.vx, ball.vz);
  if(sp > 25) blip(700+Math.random()*140, 0.03, 'square', clamp(sp/900,0.02,0.09));
}
function collideRods(dt){
  for(let ri=0; ri<rods.length; ri++){
    const rod = rods[ri], def = rod.def;
    const dx0 = ball.x - def.x;
    if(Math.abs(dx0) > 10) continue;
    const dir = def.team===0 ? 1 : -1;
    const a = rod.angle;
    const footX = def.x + Math.sin(a)*LEG*dir;
    const footBottom = ROD_Y - LEG*Math.cos(a) + 0; // ~1.7 at rest
    const feetDown = footBottom < BALL_R*2 + 1.2;   // can touch ball
    const kicking = rodForward(rod);
    const swinging = rod.kickT >= 0;
    // during a swing the toe is lifted: never static-block, only strike.
    // (otherwise the backswing shoves a point-blank ball out of the strike zone)
    if(swinging && !kicking) continue;
    if(!feetDown && !kicking) continue;
    for(let mi=0; mi<rod.men.length; mi++){
      const mz = rod.offset + rod.men[mi].rel;
      const dz = ball.z - mz;
      // kicks get a wider, more forgiving contact window than static blocks
      if(Math.abs(dz) > MAN_HALF + BALL_R + (kicking ? 1.1 : 0)) continue;
      const dx = ball.x - footX;
      if(kicking){
        // generous sweep zone in front of the rod (slight reach behind too)
        const sweepFrom = def.x - 3.4*dir, sweepTo = def.x + (LEG*0.95+BALL_R)*dir;
        const lo = Math.min(sweepFrom, sweepTo), hi = Math.max(sweepFrom, sweepTo);
        if(ball.x > lo && ball.x < hi && ball.y < 5.4){
          const power = def.team===0 ? MODE.playerKick : MODE.aiKick;
          ball.vx = dir * power * (0.9 + 0.14*Math.cos(dz*0.5));
          ball.vz = ball.vz*0.25 + dz*16 + rod.vOff*0.55;
          ball.vy = 42;
          ball.x = footX + (BALL_R+1.3)*dir;
          thock(0.6); shake = Math.max(shake, 0.55);
          return;
        }
      } else if(!swinging && Math.abs(dx) < BALL_R + 1.15 && ball.y < 4.6){
        // static block / dribble
        const push = dx >= 0 ? 1 : -1;
        ball.x = footX + push*(BALL_R + 1.2);
        const approach = Math.abs(ball.vx);
        ball.vx = -ball.vx*0.5;
        ball.vz = ball.vz*0.6 + rod.vOff*0.65 + dz*6;
        if(approach > 30){ thock(clamp(approach/400,0.12,0.4)); if(def.role==='GK' && def.team===0) stats.saves++; }
        return;
      }
    }
  }
}

/* ---------------- AI ---------------- */
function updateAI(dt){
  const react = 1 - Math.pow(0.0001, dt/Math.max(MODE.aiReact,0.02));
  AI_RODS.forEach(function(ri){
    const rod = rods[ri], def = rod.def;
    rod.aiBallZ = lerp(rod.aiBallZ, ball.z, react);
    // human error: aim drifts, resampled periodically (tighter in WILD)
    rod.aimT -= dt;
    if(rod.aimT <= 0){ rod.aimT = 0.7 + Math.random()*0.6; rod.aimErr = (Math.random()*2-1)*MODE.err; }
    const aimZ = rod.aiBallZ + rod.aimErr;
    // choose man nearest the (lagged) ball z, set offset so he lines up
    let best = 0, bestD = 1e9;
    for(let i=0;i<def.n;i++){
      const rel = (i-(def.n-1)/2)*def.s;
      const want = clamp(aimZ - rel, -def.travel, def.travel);
      const d = Math.abs((want + rel) - aimZ);
      if(d < bestD){ bestD = d; best = want; }
    }
    // defenders bias slightly toward goal-line center
    if(def.role==='GK' || def.role==='DEF') best = clamp(best*0.92, -def.travel, def.travel);
    rod.target = best;
    // kick logic — VAULT attacks -x, foot sweeps toward -x
    const inZone = ball.x < def.x + 2.5 && ball.x > def.x - (LEG+BALL_R+1.5);
    const aligned = Math.abs(ball.z - (rod.offset + nearestRel(rod))) < 3.1;
    const notTooFast = Math.abs(ball.vx) < 150;
    if(inZone && aligned && notTooFast && rod.kickCool<=0 && Math.random() < MODE.aggro*dt*30){
      startKick(rod);
    }
  });
}
function nearestRel(rod){
  let best = 0, bd = 1e9;
  rod.men.forEach(function(m){
    const d = Math.abs(ball.z - (rod.offset + m.rel));
    if(d < bd){ bd = d; best = m.rel; }
  });
  return best;
}

/* ---------------- Player control ---------------- */
function playerRodIndex(){
  if(!autoRod) return PLAYER_RODS[selRod];
  // nearest player rod, preferring one positioned to strike (behind ball)
  let best = PLAYER_RODS[0], bd = 1e9;
  PLAYER_RODS.forEach(function(ri){
    const d = Math.abs(rods[ri].def.x - ball.x) + (rods[ri].def.x > ball.x ? 9 : 0);
    if(d < bd){ bd = d; best = ri; }
  });
  return best;
}
function updatePlayer(dt){
  const active = playerRodIndex();
  rods.forEach(function(r,i){ r.mark.visible = playing && !gameOver && i===active; });
  const rod = rods[active];
  // mouse absolute mapping (screen-up = away from camera = -z)
  let t = rod.target;
  t = pointerNY * (rod.def.travel + 6);
  // keys override / nudge
  if(keys['KeyW']||keys['ArrowUp'])   t = rod.offset - 95*dt - 1;
  if(keys['KeyS']||keys['ArrowDown']) t = rod.offset + 95*dt + 1;
  rod.target = clamp(t, -rod.def.travel, rod.def.travel);
  // keep unselected player rods loosely tracking too (nice QoL)
  PLAYER_RODS.forEach(function(ri){
    if(ri===active) return;
    const r = rods[ri];
    r.target = clamp(lerp(r.target, ball.z*0.4, 0.02), -r.def.travel, r.def.travel);
  });
  updateRodDock(active);
}
let lastDockSel = -2;
function updateRodDock(activeRodIdx){
  const chipIdx = autoRod ? 'auto' : String(selRod);
  if(lastDockSel === chipIdx + ':' + activeRodIdx) return;
  lastDockSel = chipIdx + ':' + activeRodIdx;
  document.querySelectorAll('.rod-chip').forEach(function(c){
    const v = c.getAttribute('data-rod');
    const isSel = autoRod ? (v==='auto' || Number(v)===PLAYER_RODS.indexOf(activeRodIdx)) : v===String(selRod);
    c.classList.toggle('sel', isSel);
  });
}

/* ---------------- Goals / flow ---------------- */
function onGoal(team){ // team = scorer (0 player, 1 AI)
  score[team]++;
  goalCooldown = 1.6; servePending = team===0 ? 1 : 0; // conceding team gets serve
  el('s0').textContent = score[0]; el('s1').textContent = score[1];
  const win = team===0;
  el('flashTxt').textContent = win ? 'SCORED.' : 'CONCEDED.';
  el('flashTxt').style.color = win ? '#7EB8FF' : '#22D3EE';
  el('flashSub').textContent = win ? 'Daylight ' + score[0] + ' to ' + score[1] + ' Vault' : 'Vault strikes back';
  el('flash').classList.remove('hidden');
  el('flash').classList.add('show');
  goalSound(win);
  shake = 1.2;
  burst(ball.x > 0 ? HX : -HX, 6, 0, win ? COL.electric : COL.cyan);
  setTimeout(function(){ el('flash').classList.remove('show'); }, 1100);
  setTimeout(function(){ el('flash').classList.add('hidden'); }, 1350);
  if(score[team] >= MODE.win){ endMatch(team); }
}
function serve(toTeam){
  ball.x = 0; ball.z = (Math.random()*2-1)*10; ball.y = BALL_R + 6;
  const d = toTeam===0 ? -1 : 1;
  ball.vx = d * MODE.serveV; ball.vz = (Math.random()*2-1)*38; ball.vy = 0;
}
function endMatch(winner){
  gameOver = true;
  el('endTitle').textContent = winner===0 ? 'GROWN.' : 'WILTED.';
  el('endTitle').style.color = winner===0 ? '#7EB8FF' : '#22D3EE';
  el('endScore').textContent = score[0] + ' to ' + score[1];
  const m = Math.floor(clockT/60), s = Math.floor(clockT%60);
  el('endStats').textContent = 'time ' + m + ':' + String(s).padStart(2,'0') + ' · kicks ' + stats.kicks + ' · saves ' + stats.saves + ' · ' + modeName.toLowerCase() + ' mode';
  setTimeout(function(){ el('end').classList.remove('hidden'); }, 900);
  if(winner===0){ blip(523,0.14,'triangle',0.2); blip(659,0.14,'triangle',0.2,0.12); blip(784,0.14,'triangle',0.2,0.24); blip(1047,0.4,'triangle',0.24,0.36); }
}
function resetMatch(){
  score = [0,0]; clockT = 0; stats = { kicks:0, saves:0 }; gameOver = false;
  el('s0').textContent = '0'; el('s1').textContent = '0';
  rods.forEach(function(r){ r.offset = 0; r.target = 0; r.angle = 0; r.kickT = -1; });
  goalCooldown = 0.4; servePending = Math.random()<0.5 ? 0 : 1;
}

/* ---------------- Particles — goals explode into flowers ---------------- */
function burst(x,y,z,color){
  // blossom petal shower
  const inward = x > 0 ? -20 : 20;
  for(let i=0;i<26;i++){
    const icon = (Math.random()*7)|0;
    const hex = BLOOM_HEXES[(Math.random()*BLOOM_HEXES.length)|0];
    const mat = new THREE.SpriteMaterial({ map: bloomTex(icon, hex), transparent:true,
      opacity:1, depthWrite:false, toneMapped:false });
    mat.rotation = Math.random()*Math.PI*2;
    const spr = new THREE.Sprite(mat);
    const sc = 1.6 + Math.random()*2.8;
    spr.scale.set(sc, sc, 1);
    spr.position.set(x, y, z);
    scene.add(spr);
    const th = Math.random()*Math.PI*2, sp = 14 + Math.random()*34;
    particleBursts.push({ type:'petal', spr:spr,
      vel:[ Math.cos(th)*sp*0.8 + inward, 22 + Math.random()*38, Math.sin(th)*sp ],
      rs: -4 + Math.random()*8, life: 1.5 + Math.random()*0.6 });
  }
  // spark burst in the scoring team's accent
  const N = 90;
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(N*3), vel = [];
  for(let i=0;i<N;i++){
    pos[i*3]=x; pos[i*3+1]=y; pos[i*3+2]=z;
    const th = Math.random()*Math.PI*2, ph = Math.random()*Math.PI, sp = 18+Math.random()*46;
    vel.push([ Math.sin(ph)*Math.cos(th)*sp + inward, Math.abs(Math.cos(ph))*sp*1.2, Math.sin(ph)*Math.sin(th)*sp ]);
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  const mat = new THREE.PointsMaterial({ color:color, size:1.0, transparent:true, opacity:1, toneMapped:false, depthWrite:false });
  const pts = new THREE.Points(geo, mat);
  scene.add(pts);
  particleBursts.push({ type:'points', pts:pts, vel:vel, life:1.2 });
}
function updateBursts(dt){
  for(let i=particleBursts.length-1;i>=0;i--){
    const b = particleBursts[i];
    b.life -= dt;
    if(b.life <= 0){
      if(b.type==='petal'){ scene.remove(b.spr); b.spr.material.dispose(); }
      else { scene.remove(b.pts); b.pts.geometry.dispose(); b.pts.material.dispose(); }
      particleBursts.splice(i,1); continue;
    }
    if(b.type==='petal'){
      b.vel[1] -= 55*dt;                       // petals fall soft
      b.spr.position.x += b.vel[0]*dt;
      b.spr.position.y += b.vel[1]*dt;
      b.spr.position.z += b.vel[2]*dt;
      b.spr.material.rotation += b.rs*dt;
      if(b.spr.position.y < 0.6){ b.spr.position.y = 0.6; b.vel[1] *= -0.35; }
      b.spr.material.opacity = clamp(b.life, 0, 1);
    } else {
      const arr = b.pts.geometry.attributes.position.array;
      for(let j=0;j<b.vel.length;j++){
        b.vel[j][1] -= 80*dt;
        arr[j*3]   += b.vel[j][0]*dt;
        arr[j*3+1] += b.vel[j][1]*dt;
        arr[j*3+2] += b.vel[j][2]*dt;
        if(arr[j*3+1] < 0.4){ arr[j*3+1] = 0.4; b.vel[j][1] *= -0.4; }
      }
      b.pts.geometry.attributes.position.needsUpdate = true;
      b.pts.material.opacity = clamp(b.life,0,1);
    }
  }
}

/* ---------------- Camera ---------------- */
const CAMS = [
  { pos:[0, 86, 98],  look:[0,0,0], follow:0.24 },   // broadcast
  { pos:[0, 34, 76],  look:[0,4,0], follow:0.38 },   // low drama
  { pos:[0, 146, 22], look:[0,0,0], follow:0.10 }    // top (z-offset keeps the roll stable)
];
const camCur = { x:0, y:86, z:98, lx:0, ly:0, lz:0 };
function updateCamera(dt){
  let px, py, pz, lx, ly, lz;
  if(camMode === 3){
    const cy = Math.cos(orbit.pitch), sy = Math.sin(orbit.pitch);
    px = Math.sin(orbit.yaw)*cy*orbit.dist;
    py = sy*orbit.dist;
    pz = Math.cos(orbit.yaw)*cy*orbit.dist;
    lx = 0; ly = 0; lz = 0;
  } else {
    const c = CAMS[camMode];
    px = c.pos[0] + ball.x*0.12; py = c.pos[1]; pz = c.pos[2];
    lx = c.look[0] + ball.x*c.follow; ly = c.look[1]; lz = c.look[2] + ball.z*c.follow*0.7;
  }
  const k = 1 - Math.pow(0.0001, dt);
  camCur.x = lerp(camCur.x, px, k); camCur.y = lerp(camCur.y, py, k); camCur.z = lerp(camCur.z, pz, k);
  camCur.lx = lerp(camCur.lx, lx, k); camCur.ly = lerp(camCur.ly, ly, k); camCur.lz = lerp(camCur.lz, lz, k);
  let sx = 0, sy = 0;
  if(shake > 0){ shake = Math.max(0, shake - dt*2.2); sx = (Math.random()*2-1)*shake*1.3; sy = (Math.random()*2-1)*shake*1.0; }
  camera.position.set(camCur.x + sx, camCur.y + sy, camCur.z);
  camera.lookAt(camCur.lx, camCur.ly, camCur.lz);
}

/* ---------------- Main loop ----------------
   Fixed-timestep simulation (120 Hz) fed by rAF, with a setInterval watchdog
   so the game keeps running even where rAF is throttled (embeds, iframes,
   background tabs, the X player card). */
const SIM_STEP = 1/120;
let lastReal = 0, simAcc = 0, trailIdx = 0, trailAcc = 0;
function simStep(dt){
  worldT += dt;
  updatePetals(dt);
  updateButterflies(dt);
  updateBursts(dt);
  if(playing && !paused && !gameOver){
    clockT += dt;
    wallTickCool = Math.max(0, wallTickCool - dt);
    updatePlayer(dt);
    updateAI(dt);
    updateRodAnims(dt);
    if(goalCooldown > 0){
      goalCooldown -= dt;
      if(goalCooldown <= 0 && servePending >= 0){ serve(servePending); servePending = -1; }
    } else {
      stepPhysics(dt/2); stepPhysics(dt/2);
      // anti-stall: dead balls get tossed back into play
      const spd = Math.hypot(ball.vx, ball.vz);
      if(spd < 6 && ball.y <= BALL_R + 0.05) stallT += dt; else stallT = 0;
      if(stallT > 3.2){
        stallT = 0;
        ball.vy = 55;
        ball.vx = (ball.x > 0 ? -1 : 1) * (30 + Math.random()*35);
        ball.vz = (Math.random()*2-1)*45;
        blip(340, 0.08, 'triangle', 0.1);
      }
    }
  } else {
    if(!playing){ orbit.yaw += dt*0.12; }
    updateRodAnims(dt);
  }
}
function render(dt){
  if(playing){
    const m = Math.floor(clockT/60), s = Math.floor(clockT%60);
    el('clock').textContent = m + ':' + String(s).padStart(2,'0');
    ballMesh.position.set(ball.x, ball.y, ball.z);
    ballLight.position.set(ball.x, ball.y+4, ball.z);
    const sp = Math.hypot(ball.vx, ball.vz);
    if(sp > 1){
      const axis = new THREE.Vector3(ball.vz, 0, -ball.vx).normalize();
      ballMesh.rotateOnWorldAxis(axis, sp*dt/BALL_R);
    }
    trailAcc += dt;
    if(trailAcc > 0.024){
      trailAcc = 0;
      const arr = trailGeo.attributes.position.array;
      arr[trailIdx*3] = ball.x; arr[trailIdx*3+1] = ball.y; arr[trailIdx*3+2] = ball.z;
      trailIdx = (trailIdx+1) % 22;
      trailGeo.attributes.position.needsUpdate = true;
    }
    trailPts.material.opacity = clamp(sp/240, 0, 0.5);
    updateCamera(Math.min(dt, 0.05));
  } else {
    ballMesh.position.set(0, BALL_R, 0);
    ballMesh.rotation.y += dt*0.6;
    // cinematic slow orbit pre-game
    const d = 120;
    camera.position.set(Math.sin(orbit.yaw)*d, 62, Math.cos(orbit.yaw)*d);
    camera.lookAt(0, -2, 0);
  }
  renderer.render(scene, camera);
}
function pump(now){
  if(!lastReal) lastReal = now;
  const elapsed = Math.min(0.1, (now - lastReal)/1000);
  lastReal = now;
  simAcc += elapsed;
  let n = 0;
  while(simAcc >= SIM_STEP && n < 24){ simStep(SIM_STEP); simAcc -= SIM_STEP; n++; }
  render(elapsed || SIM_STEP);
}
function frame(t){
  requestAnimationFrame(frame);
  pump(t);
}

/* ---------------- Input ---------------- */
function bindInput(){
  const cv = el('gl');
  window.addEventListener('keydown', function(e){
    keys[e.code] = true;
    if(e.code === 'Space'){ e.preventDefault(); if(playing && !paused && !gameOver) startKick(rods[playerRodIndex()]); }
    if(e.code >= 'Digit1' && e.code <= 'Digit4'){ autoRod = false; selRod = Number(e.code.slice(5))-1; }
    if(e.code === 'ArrowLeft'  || e.code === 'KeyA'){ autoRod = false; selRod = (selRod+3)%4; }
    if(e.code === 'ArrowRight' || e.code === 'KeyD'){ autoRod = false; selRod = (selRod+1)%4; }
    if(e.code === 'KeyQ'){ autoRod = !autoRod; }
    if(e.code === 'KeyC'){ camMode = (camMode+1)%4; }
    if(e.code === 'KeyM'){ muted = !muted; }
    if(e.code === 'KeyP' || e.code === 'Escape'){ if(playing && !gameOver){ paused = !paused; el('pause').classList.toggle('hidden', !paused); } }
  });
  window.addEventListener('keyup', function(e){ keys[e.code] = false; });

  cv.addEventListener('pointermove', function(e){
    if(camMode===3 && orbit.drag){
      orbit.yaw   -= (e.clientX - orbit.px)*0.005;
      orbit.pitch  = clamp(orbit.pitch + (e.clientY - orbit.py)*0.004, 0.15, 1.35);
      orbit.px = e.clientX; orbit.py = e.clientY;
      return;
    }
    pointerNY = clamp((e.clientY/innerHeight - 0.5)*2.6, -1, 1);
  });
  cv.addEventListener('pointerdown', function(e){
    audio();
    if(camMode===3){ orbit.drag = true; orbit.px = e.clientX; orbit.py = e.clientY; return; }
    if(playing && !paused && !gameOver) startKick(rods[playerRodIndex()]);
  });
  window.addEventListener('pointerup', function(){ orbit.drag = false; });
  // touch: drag = move (handled by pointermove), dedicated kick button
  el('kickBtn').addEventListener('pointerdown', function(e){
    e.stopPropagation(); e.preventDefault();
    if(playing && !paused && !gameOver) startKick(rods[playerRodIndex()]);
  });
  if(window.matchMedia && window.matchMedia('(pointer: coarse)').matches){
    document.body.classList.add('touch');
  }
  document.querySelectorAll('.rod-chip').forEach(function(c){
    c.addEventListener('click', function(){
      const v = c.getAttribute('data-rod');
      if(v === 'auto'){ autoRod = true; } else { autoRod = false; selRod = Number(v); }
      lastDockSel = -2;
    });
  });
  window.addEventListener('blur', function(){
    if(playing && !gameOver && !paused){ paused = true; el('pause').classList.remove('hidden'); }
  });
  window.addEventListener('resize', onResize);
}
function onResize(){
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
}

/* ---------------- UI wiring ---------------- */
function setMode(name){
  modeName = name; MODE = MODES[name];
  document.documentElement.style.setProperty('--accent', MODE.accent);
  el('modeGarden').classList.toggle('active', name==='GARDEN');
  el('modeWild').classList.toggle('active', name==='WILD');
  el('modeWild').classList.toggle('wild', name==='WILD');
  el('playBtn').style.background = MODE.accent;
  el('againBtn').style.background = MODE.accent;
  el('kickBtn').style.borderColor = MODE.accent;
}
function startGame(){
  resetMatch();
  playing = true; paused = false;
  el('start').classList.add('hidden');
  el('end').classList.add('hidden');
  el('hud').classList.remove('hidden');
  camMode = 0;
  camCur.x = 0; camCur.y = 86; camCur.z = 98;
  audio();
  blip(392,0.1,'triangle',0.15); blip(523,0.18,'triangle',0.18,0.1);
}

/* ---------------- Boot ---------------- */
function loadImage(src){
  return new Promise(function(res, rej){
    const i = new Image();
    i.onload = function(){ res(i); };
    i.onerror = rej;
    i.src = src;
  });
}
Promise.all(
  [loadImage(ASSETS.eye), loadImage(ASSETS.logo)].concat(ASSETS.blooms.map(loadImage))
).then(function(imgs){
  images = { eye:imgs[0], logo:imgs[1], blooms: imgs.slice(2) };
  // DOM images
  el('startLogo').src = ASSETS.logo;
  el('endLogo').src = ASSETS.logo;
  el('wm').src = ASSETS.logo;
  el('eb1').src = ASSETS.blooms[0]; el('eb2').src = ASSETS.blooms[0];
  for(let i=1;i<=7;i++) el('ir'+i).src = ASSETS.blooms[i-1];
  el('tagD').src = ASSETS.blooms[3];
  el('tagV').src = recolor(images.blooms[5], '#22D3EE').toDataURL();

  renderer = new THREE.WebGLRenderer({ canvas: el('gl'), antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.08;

  buildScene();
  bindInput();
  setMode('GARDEN');
  el('modeGarden').addEventListener('click', function(){ setMode('GARDEN'); });
  el('modeWild').addEventListener('click', function(){ setMode('WILD'); });
  el('playBtn').addEventListener('click', startGame);
  el('againBtn').addEventListener('click', startGame);
  requestAnimationFrame(frame);
  // watchdog: if rAF stalls (throttled embed/background tab), keep the sim alive
  setInterval(function(){
    const now = performance.now();
    if(now - lastReal > 80) pump(now);
  }, 66);
});
</script>
