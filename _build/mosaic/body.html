<section class="mz" id="mz" aria-label="THE MOSAIC, MLow in his cab made of New Yorkers">
  <canvas id="mzc" tabindex="0" aria-label="Mosaic. Drag to move, scroll or pinch to zoom, click a tile to open it. Arrow keys move between tiles."></canvas>
  <header class="mz-top">
    <div class="mz-title"><span class="mz-k">THE MOSAIC</span><b>MLow in his cab, <i>made of New Yorkers.</i></b></div>
    <div class="mz-tools">
      <div class="mz-find">
        <input id="mzq" type="search" placeholder="Find a New Yorker: name or number" autocomplete="off" spellcheck="false" aria-label="Find a New Yorker by name or number">
        <div class="mz-res" id="mzRes" hidden></div>
      </div>
      <button class="mz-btn" id="mzMint" aria-pressed="false">MINTED</button>
      <button class="mz-btn" id="mzToday" hidden>TODAY</button>
      <button class="mz-btn" id="mzRand">RANDOM</button>
      <button class="mz-btn" id="mzFit">WHOLE</button>
    </div>
  </header>
  <div class="mz-stats" id="mzStats"></div>
  <div class="mz-tip" id="mzTip" hidden></div>
  <div class="mz-hint" id="mzHint">Scroll or pinch to zoom. Drag to move. Click any tile.</div>
  <aside class="mz-card" id="mzCard" hidden aria-live="polite"></aside>
</section>
