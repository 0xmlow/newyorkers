<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEW YORKERS · The Count</title>
<meta name="description" content="First THE COUNT, then THE CLAIM. The countdown to the NEW YORKERS claim, and the live census.">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/png" href="assets/brand/eye_truecolor.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Oswald:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="assets/site.css">
<style>
body{background:#000}
#page{min-height:100vh;display:flex;flex-direction:column}
#top{padding:26px clamp(20px,5vw,48px);display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1e2126}
#top img{height:30px}
.live{display:flex;align-items:center;gap:14px;font-family:var(--mono);font-size:13px;letter-spacing:.3em;color:var(--cyan)}
.live i{width:9px;height:9px;border-radius:50%;background:var(--cyan);animation:pulse 1.6s ease-in-out infinite}
#mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:44px;padding:60px 20px;text-align:center}
.lab{font-family:var(--mono);font-size:clamp(11px,1.2vw,15px);letter-spacing:.44em;color:var(--slate)}
#clock{display:flex;align-items:baseline;gap:clamp(10px,3vw,36px)}
#clock .u{display:flex;flex-direction:column;align-items:center;gap:10px}
#clock .d{font-size:clamp(56px,13vw,220px);font-weight:800;line-height:.9;font-variant-numeric:tabular-nums}
#clock .u:last-child .d{color:var(--cyan)}
#clock .c{font-size:clamp(36px,8vw,140px);font-weight:400;color:#2a2d34;line-height:.9}
#clock .l{font-family:var(--mono);font-size:clamp(9px,1vw,13px);letter-spacing:.4em;color:#556}
.countRow{display:flex;align-items:center;gap:24px;flex-wrap:wrap;justify-content:center}
.countRow .lab{font-size:clamp(11px,1.3vw,16px);letter-spacing:.26em}
.countRow .big{font-size:clamp(36px,5vw,58px);font-weight:800;font-variant-numeric:tabular-nums}
.getBtn{background:var(--cloud);color:#000;font-family:var(--display);font-size:clamp(20px,2.6vw,30px);font-weight:800;padding:22px 64px;letter-spacing:.04em}
.getBtn:hover{background:var(--blue);color:var(--cloud)}
.fine{font-family:var(--mono);font-size:12px;letter-spacing:.2em;color:#556}
#strip{border-top:1px solid #1e2126;overflow:hidden}
#strip .row{display:flex;width:max-content;animation:marqueeL 60s linear infinite}
#strip img{width:120px;height:120px;object-fit:cover;display:block}
#bot{padding:18px clamp(20px,5vw,48px);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-family:var(--mono);font-size:12px;letter-spacing:.24em;color:#556;border-top:1px solid #1e2126}
/* projection mode */
body.proj #top,body.proj #strip,body.proj #bot,body.proj #nav,body.proj .getBtn,body.proj .fine,body.proj #clockWrap{display:none}
body.proj #mid{cursor:none;gap:0}
body.proj .pl{font-family:var(--sans);font-weight:700;font-size:2.2vw;letter-spacing:.7em;color:#556677;text-transform:uppercase}
body.proj .pn{font-family:var(--mono);font-weight:700;font-size:19vw;line-height:1;letter-spacing:.03em;margin-top:2vh}
body.proj .pb{width:16vw;height:.8vh;background:var(--blue);margin-top:5vh}
body.proj .pu{font-family:var(--mono);font-size:1.4vw;letter-spacing:.5em;color:#556677;margin-top:5vh}
body.proj .dot{position:fixed;bottom:4vh;right:4vw;width:1vw;height:1vw;border-radius:50%;background:var(--pink);animation:pulse 2s infinite}
#projBox{display:none}
body.proj #projBox{display:flex;flex-direction:column;align-items:center}
body.proj .countRow{display:none}
</style>
</head>
<body>
<div id="nav"></div>
<div id="page">
  <div id="top"><a href="index.html"><img src="assets/brand/logo_white.png" alt="MLOW"></a><div class="live"><i></i><span id="liveLabel">ENUMERATION OPEN</span></div></div>
  <div id="mid">
    <div id="clockWrap" style="display:flex;flex-direction:column;align-items:center;gap:44px">
      <div class="lab" id="clockLabel">THE CLAIM OPENS IN</div>
      <div id="clock">
        <div class="u"><div class="d" id="dd">00</div><div class="l">DAYS</div></div><div class="c">:</div>
        <div class="u"><div class="d" id="hh">00</div><div class="l">HOURS</div></div><div class="c">:</div>
        <div class="u"><div class="d" id="mm">00</div><div class="l">MINUTES</div></div><div class="c">:</div>
        <div class="u"><div class="d" id="ss">00</div><div class="l">SECONDS</div></div>
      </div>
      <div class="fine" id="claimNote"></div>
    </div>
    <div class="countRow"><div class="lab" id="cLab">CHARACTERS PAINTED</div><div class="big" id="cNum">0</div><div class="lab">FOR 365 CLAIMS</div></div>
    <div id="projBox"><div class="pl" id="pLab">CHARACTERS PAINTED</div><div class="pn" id="pNum">0</div><div class="pb"></div><div class="pu" id="pUrl"></div><div class="dot"></div></div>
    <a class="getBtn" href="counted.html">GET COUNTED</a>
    <div class="fine">FREE · WALLETLESS · EVERYONE WHO REGISTERS IS COUNTED, PERMANENTLY</div>
  </div>
  <div id="strip"><div class="row" id="stripRow"></div></div>
  <div id="bot"><div id="botCount"></div><div id="botClaim"></div><div>ART, NOT AN INVESTMENT PRODUCT</div></div>
</div>
<script src="assets/config.js"></script>
<script src="assets/data.js"></script>
<script src="assets/site.js"></script>
<script>
(function(){
"use strict";
const {C,CFG,thumb,num,sample,recordUrl,esc}=NY;
const $=s=>document.querySelector(s);
const q=new URLSearchParams(location.search);
const proj=q.get("mode")==="projection";
if(proj)document.body.classList.add("proj"); else NY.nav("THE COUNT");
const target=new Date(CFG.claimDate||"2026-10-08T11:11:00-04:00").getTime();
const pad=n=>String(n).padStart(2,"0");
function tick(){
  let diff=target-Date.now();
  if(diff<=0){ $("#clockLabel").textContent="THE CLAIM IS OPEN"; diff=0; $("#liveLabel").textContent="THE CLAIM IS OPEN"; }
  const dd=Math.floor(diff/864e5); diff-=dd*864e5; const hh=Math.floor(diff/36e5); diff-=hh*36e5; const mm=Math.floor(diff/6e4); diff-=mm*6e4; const ss=Math.floor(diff/1e3);
  $("#dd").textContent=pad(dd);$("#hh").textContent=pad(hh);$("#mm").textContent=pad(mm);$("#ss").textContent=pad(ss);
}
tick(); setInterval(tick,1000);
$("#claimNote").innerHTML=esc(CFG.claimLabel||"")+(CFG.claimSigned?"":' · <span class="unsigned">recommended date, not yet signed</span>');
const people=CFG.peopleCounted;
const label=people?"PEOPLE COUNTED":"CHARACTERS PAINTED", value=people||C.pieces;
$("#cLab").textContent=label; $("#pLab").textContent=label; $("#pUrl").textContent=CFG.domain||"NEWYORKERS.MLOW.XYZ";
(function count(){ const setF=()=>{$("#cNum").textContent=num(value); $("#pNum").textContent=num(value);}; if(document.hidden){setF();return;} const t0=performance.now(),dur=1800; setTimeout(setF,dur+200); (function f(){const k=Math.min(1,(performance.now()-t0)/dur); const v=Math.floor(value*(1-Math.pow(1-k,3))); $("#cNum").textContent=num(v); $("#pNum").textContent=num(v); if(k<1)requestAnimationFrame(f);})(); })();
$("#botCount").textContent="THE COUNT · "+(CFG.countLabel||"");
$("#botClaim").textContent="THE CLAIM · "+(CFG.claimLabel||"");
const strip=sample(24,p=>p.e>=2,Math.floor(Date.now()/36e5));
$("#stripRow").innerHTML=strip.concat(strip).map(p=>`<a href="${recordUrl(p)}"><img loading="lazy" src="${thumb(p)}" alt="${esc(p.t)}"></a>`).join("");
})();
</script>
</body>
</html>
